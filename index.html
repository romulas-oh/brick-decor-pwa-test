<style>
:root{--red:#ff5b5f;--red2:#fff0f0;--bg:#f7f8fb;--card:#fff;--line:#e8ebf2;--text:#222631;--muted:#6f7684;--green:#18a058;--orange:#f59e0b;--blue:#3b82f6;--shadow:0 12px 28px rgba(17,24,39,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}.app{display:flex;min-height:100vh}.side{width:250px;background:#fff;border-right:1px solid var(--line);padding:22px;position:fixed;top:0;bottom:0;overflow:auto}.main{margin-left:250px;width:calc(100% - 250px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:38px;height:38px;border:2px solid var(--red);border-radius:8px;position:relative}.mark:before{content:"";position:absolute;width:22px;height:16px;border:2px solid var(--red);left:6px;bottom:5px}.mark:after{content:"";position:absolute;width:16px;height:16px;border-left:2px solid var(--red);border-top:2px solid var(--red);transform:rotate(45deg);left:9px;top:2px;background:#fff}.brand b{letter-spacing:.12em;font-size:18px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:13px;margin:3px 0;font-weight:750;color:#3b4250;cursor:pointer}.nav button.active,.nav button:hover{background:var(--red2);color:var(--red)}.promo{margin-top:24px;background:linear-gradient(135deg,var(--red),#ff8276);border-radius:18px;color:#fff;padding:18px;box-shadow:var(--shadow)}.promo p{font-size:12px;line-height:1.45}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3}.search{border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:380px}.user{display:flex;align-items:center;gap:12px}.avatar{background:#222;color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-weight:900}.content{padding:26px;max-width:1500px;margin:auto}.page{display:none}.page.active{display:block}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.crumb{font-size:12px;color:var(--muted);margin-bottom:7px}h1{margin:0;font-size:28px}h3{margin:0 0 14px}.sub{color:var(--muted);margin:4px 0 0}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 15px;font-weight:850;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.red{border-color:#ffd3d5;color:var(--red)}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(6,1fr)}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.sidegrid{grid-template-columns:1fr 360px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.kpi .n{font-size:25px;font-weight:950;margin:4px 0}.small{font-size:12px;color:var(--muted)}.up{color:var(--green);font-weight:850}.down{color:#e5484d;font-weight:850}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:850}.green{background:#e9f8ef;color:var(--green)}.orange{background:#fff7e6;color:#b77900}.red{background:#fff1f1;color:#e5484d}.blue{background:#eef5ff;color:var(--blue)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{background:#fafbfc;color:#687083;font-size:12px}.progress{height:9px;background:#f0f2f5;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff8a75)}.progress.g span{background:linear-gradient(90deg,var(--green),#88d8a5)}.money{font-size:23px;font-weight:950}.total{font-size:31px;color:var(--red);font-weight:950}.field label{display:block;font-size:12px;color:var(--muted);font-weight:850;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.field textarea{min-height:90px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.notice{background:var(--red2);border:1px solid #ffd5d6;color:#8b3036;border-radius:14px;padding:13px;margin:16px 0}.valid{border-color:#a3e6b7!important}.invalid{border-color:#ffb4b6!important;background:#fff8f8!important}.upload{min-height:96px;border:1px dashed #cbd1dc;border-radius:14px;display:grid;place-items:center;color:var(--muted);font-weight:800;text-align:center;background:#fbfcfe}.uploads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.thumb{height:82px;border-radius:12px;background:linear-gradient(135deg,#c7b6a3,#f1ece5);border:1px solid var(--line);position:relative}.video:after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);color:#fff;font-size:24px;border-radius:12px}.tabs{display:flex;gap:10px;border-bottom:1px solid var(--line);margin:16px -18px 18px;padding:0 18px}.tabs span{padding:10px 4px;font-weight:850;color:#687083}.tabs .active{color:var(--red);border-bottom:3px solid var(--red)}.donut{width:180px;height:180px;border-radius:50%;background:conic-gradient(var(--blue) 0 19%,var(--orange) 19% 50%,#ff5b5f 50% 59%,#4b5563 59% 65%,#cbd5e1 65% 100%);position:relative;margin:auto}.donut:after{content:"32\A Total Projects";white-space:pre;position:absolute;inset:42px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:900;font-size:26px;line-height:1.1}@media(max-width:1050px){.side{position:static;width:auto}.main{margin-left:0;width:100%}.app{display:block}.kpis,.two,.three,.four,.sidegrid,.form{grid-template-columns:1fr}.search{width:100%}.top{height:auto;flex-wrap:wrap;padding:14px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="mark"></div><b>BRICK & DECOR</b></div><div class="nav" id="nav"></div><div class="promo"><b>Design. Build. Deliver.</b><p>Test-data HTML demo for ID quotation, VO, PO, DO, invoice, project cost, warranty and commission workflow.</p></div></aside>
<main class="main"><div class="top"><input class="search" placeholder="Search anything..."><div class="user"><span>🔔</span><div class="avatar">A</div><div><b>Admin</b><div class="small">Superadmin</div></div></div></div><div class="content" id="content"></div></main>
</div>
<script>
const money=n=>'$'+Number(n||0).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>'$'+Number(n||0).toLocaleString('en-SG',{maximumFractionDigits:0});
const nav=[['dashboard','🏠 Dashboard'],['clients','👥 Clients / Case'],['quotation','📄 Quotation'],['projects','🏗️ Project Cost'],['vo','🧾 VO'],['po','📦 PO'],['do','✅ DO / Handover'],['invoices','💳 Invoices & Payments'],['warranty','🛡️ Warranty & Media'],['profit','📊 Profit & Commission'],['master','⚙️ Master Data']];
const projects=[
 ['Condo Renovation - 28A','Jessica Tan','Alex Wong','In Progress',55,'Carpentry Install','16 May 2025'],
 ['Kitchen Carpentry - K3','Michael Lim','Rachel Lee','Planning',20,'Design Finalization','15 May 2025'],
 ['Office Refurbishment - 12F','Acme Pte Ltd','Alex Wong','In Progress',45,'Electrical Works','15 May 2025'],
 ['Landed House - T19','David & Family','Rachel Lee','Handover',100,'Final Touch-up','12 May 2025'],
 ['Retail Shopfit - #B2-08','Urban Retail SG','Ethan Ng','On Hold',30,'Material Delivery','10 May 2025']
];
const items=[
 {d:'Custom Kitchen Carpentry',c:'Carpentry',q:1,u:'Lot',cost:8000,price:10400},
 {d:'Quartz Kitchen Top',c:'Surface',q:1,u:'Lot',cost:3000,price:4200},
 {d:'Backsplash (Porcelain)',c:'Tiles',q:1,u:'Lot',cost:1600,price:2160},
 {d:'LED Strip Light Fitting',c:'Electrical',q:1,u:'Lot',cost:650,price:845}
];
const costs=[
 ['Materials','Porcelain Tiles – Living Area','Niro Granite Pte Ltd','INV-2025-0187','10 May 2025',2500,2250,0,'Paid'],
 ['Materials','Kitchen Cabinets – Package','Carpentry Works','INV-2025-0192','12 May 2025',4800,2400,2400,'Partial'],
 ['Manpower','Carpentry Labour','Internal Team','MP-2025-0007','8 May 2025',1600,1120,0,'Paid'],
 ['Manpower','Tiling Labour','Internal Team','MP-2025-0008','9 May 2025',900,630,0,'Paid'],
 ['Transport','Transport & Delivery','Fast Track Logistics','INV-2025-0201','11 May 2025',360,280,0,'Paid'],
 ['Misc','Site Cleaning','Clean & Clear Pte Ltd','INV-2025-0205','13 May 2025',300,275.76,0,'Paid']
];
function pill(s){let c={Paid:'green','In Progress':'green',Planning:'blue',Handover:'orange','On Hold':'red',Pending:'orange',Partial:'orange','Partially Paid':'orange',Completed:'green',Draft:'blue',Active:'green'}[s]||'blue';return `<span class="pill ${c}">${s}</span>`}
function head(t,s,c,a=''){return `<div class="head"><div><div class="crumb">${c}</div><h1>${t}</h1><p class="sub">${s}</p></div><div>${a}</div></div>`}
function field(l,v,type='input'){return `<div class="field"><label>${l}</label>${type==='textarea'?`<textarea>${v}</textarea>`:type==='select'?`<select>${v.split('|').map(x=>`<option>${x}</option>`).join('')}</select>`:`<input value="${v}">`}</div>`}
function tableProject(){return `<table><thead><tr><th>Project</th><th>Client</th><th>ID</th><th>Status</th><th>Progress</th><th>Milestone</th><th>Updated</th></tr></thead><tbody>${projects.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>${pill(p[3])}</td><td><b>${p[4]}%</b><div class="progress"><span style="width:${p[4]}%"></span></div></td><td>${p[5]}</td><td>${p[6]}</td></tr>`).join('')}</tbody></table>`}
const pages={};
pages.dashboard=()=>head('Dashboard','Overview of sales, pending payment, active projects, gross profit, warranty cases and commission.','Dashboard')+
`<div class="grid kpis">${[['Total Sales',1248650,'💼'],['Pending Payment',248420,'💰'],['Active Projects',32,'🧰'],['Gross Profit',312540,'📈'],['Warranty Cases',14,'🛡️'],['Commission Payable',45680,'💸']].map(x=>`<div class="card kpi"><div>${x[2]}</div><div class="small">${x[0]}</div><div class="n">${x[1]>1000?money0(x[1]):x[1]}</div><div class="up">↑ 12.4% <span class="small">vs last month</span></div></div>`).join('')}</div>
<div class="grid two" style="margin-top:16px"><div class="card"><h3>Project Status</h3><div class="donut"></div></div><div class="card"><h3>Payment Collection Progress</h3><div class="small">Collected</div><div class="money">${money0(98230)}</div><div class="small">of ${money0(246650)}</div><br><div class="progress g"><span style="width:39.8%"></span></div><br><div class="grid three"><div><b>Paid</b><br>${money0(98230)}</div><div><b>Pending</b><br>${money0(148420)}</div><div><b>Overdue</b><br>${money0(18000)}</div></div></div></div>
<div class="card" style="margin-top:16px"><h3>Recent Projects</h3>${tableProject()}</div>`;
pages.clients=()=>head('Open New Case','Create a case record before quotation, with client, site visit, warranty and salesperson details.','Clients > Case Opening','<button class="btn">Save Draft</button> <button class="btn primary">Create Case</button>')+
`<div class="grid sidegrid"><div class="grid"><div class="card"><h3>Client Details</h3><div class="form">${field('Client Type','Individual|Company','select')}${field('Client Name','Jessica Tan')}${field('NRIC / ID','S1234567A')}${field('Email','jessica.tan@email.com')}${field('Phone','+65 9123 4567')}${field('Alternate Phone','+65 9876 5432')}</div></div><div class="card"><h3>Property & Project Details</h3><div class="form">${field('Property Type','Condo|HDB|Landed|Commercial','select')}${field('Project Type','Kitchen Renovation|Full Renovation|Office Reinstatement','select')}${field('Unit No.','#24A-08')}${field('Project Name','Tan Residence - Kitchen Reno')}${field('Site Address','8 River Valley Road, #24A-08, Singapore')}${field('Start Date','15 Jun 2025')}${field('Completion Date','30 Aug 2025')}${field('Warranty','24 Months')}</div></div><div class="card"><h3>Internal Notes</h3>${field('Notes','Client prefers light palette and soft-close fittings. Interested in pull-out pantry.','textarea')}</div></div><div class="grid"><div class="card"><h3>Site Visit & Notes</h3>${field('Site Visit Date','9 May 2025')}${field('Conducted By','Aiden Lee')}${field('Site Visit Notes','Measured kitchen area and discussed material preferences.','textarea')}</div><div class="card"><h3>Before-Work Photos</h3><div class="uploads">${Array(6).fill(0).map(()=>'<div class="upload">🖼️<br>Upload Photo</div>').join('')}</div></div></div></div>`;
pages.quotation=()=>{let cost=items.reduce((a,b)=>a+b.cost*b.q,0),total=items.reduce((a,b)=>a+b.price*b.q,0);return head('Quotation Builder','Quotation with superadmin cost and allowed 30%–40% selling range.','Quotations > New Quotation','<button class="btn">Save Draft</button> <button class="btn primary">Submit</button>')+`<div class="grid sidegrid"><div><div class="grid three"><div class="card"><h3>Client</h3>Jessica Tan<br>+65 9123 4567</div><div class="card"><h3>Project</h3>Condo Renovation - 28A<br>ID: Alex Wong</div><div class="card"><h3>Warranty</h3>Labor 12 months<br>Materials as per manufacturer</div></div><div class="notice"><b>Pricing Rule:</b> ID can only key in price inside the allowed markup range.</div><div class="card"><h3>Quotation Items</h3><table><thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Cost</th><th>Allowed Range</th><th>Your Price</th><th>Amount</th></tr></thead><tbody>${items.map((i,idx)=>{let min=i.cost*1.3,max=i.cost*1.4,valid=i.price>=min&&i.price<=max;return `<tr><td><b>${i.d}</b></td><td>${i.c}</td><td>${i.q}</td><td>${money(i.cost)}</td><td>${money(min)} - ${money(max)}</td><td><input class="${valid?'valid':'invalid'}" value="${i.price}" oninput="quoteChange(${idx},this)" style="width:110px;padding:8px;border:1px solid var(--line);border-radius:10px"></td><td>${money(i.price*i.q)}</td></tr>`}).join('')}</tbody></table><br><button class="btn primary">+ Add Item</button></div></div><div class="card"><h3>Pricing Summary</h3><div class="small">Approximate Cost</div><div class="money">${money(cost)}</div><br><div class="small">Allowed Selling Range</div><b>${money(cost*1.3)} - ${money(cost*1.4)}</b><br><br><div class="small">Total Quotation</div><div class="total" id="qt">${money(total)}</div><br><button class="btn red" style="width:100%">Generate PDF</button><br><br><button class="btn primary" style="width:100%">Submit for Approval</button></div></div>`};
window.quoteChange=(idx,el)=>{items[idx].price=Number(el.value)||0;let min=items[idx].cost*1.3,max=items[idx].cost*1.4;el.className=(items[idx].price>=min&&items[idx].price<=max)?'valid':'invalid';document.getElementById('qt').innerText=money(items.reduce((a,b)=>a+b.price*b.q,0))}
pages.projects=()=>{let budget=costs.reduce((a,b)=>a+b[5],0),actual=costs.reduce((a,b)=>a+b[6],0),committed=costs.reduce((a,b)=>a+b[7],0);return head('Condo Renovation - 28A','Track real material, supplier, manpower, transport and other costs.','Projects > Real Cost','<button class="btn">Export</button> <button class="btn primary">Add Cost Entry</button>')+`<div class="card"><b>Client:</b> Jessica Tan &nbsp; <b>Site:</b> 28A River Valley Road &nbsp; ${pill('In Progress')}<div class="tabs"><span>Overview</span><span class="active">Real Cost</span><span>Manpower</span><span>Timeline</span><span>Media Upload</span><span>VO</span><span>PO</span><span>DO</span></div><div class="grid four"><div class="card"><div class="small">Budget</div><div class="money">${money(budget)}</div></div><div class="card"><div class="small">Actual Cost</div><div class="money">${money(actual)}</div></div><div class="card"><div class="small">Committed</div><div class="money">${money(committed)}</div></div><div class="card"><div class="small">Projected Final</div><div class="money">${money(actual+committed+3000)}</div></div></div><br><h3>Cost Breakdown</h3><table><thead><tr><th>Category</th><th>Description</th><th>Supplier</th><th>Ref</th><th>Date</th><th>Budget</th><th>Actual</th><th>Committed</th><th>Status</th></tr></thead><tbody>${costs.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td>${c[4]}</td><td>${money(c[5])}</td><td>${money(c[6])}</td><td>${money(c[7])}</td><td>${pill(c[8])}</td></tr>`).join('')}</tbody></table></div>`}
pages.vo=()=>head('Variation Order','Manage additional or changed work after the approved quotation.','VO > New VO','<button class="btn">Save Draft</button> <button class="btn red">Generate VO PDF</button> <button class="btn primary">Send Approval</button>')+
`<div class="grid three"><div class="card"><h3>Project Reference</h3>Condo Renovation - 28A<br>Client: Jessica Tan<br>Original: ${money(17550)}</div><div class="card"><h3>VO Details</h3>${field('VO Number','VO-2025-0003')}${field('Requested By','Jessica Tan')}${field('Reason','Additional kitchen storage and upgraded bathroom fittings.','textarea')}</div><div class="card"><h3>Updated Contract</h3>Original: ${money(17550)}<br>Previous VO: ${money(1200)}<br>This VO: <b>${money(2675)}</b><div class="total">${money(21425)}</div></div></div><br><div class="card"><h3>Variation Items</h3><table><thead><tr><th>Item</th><th>Type</th><th>Qty</th><th>Price</th><th>Amount</th><th>Reason</th><th>Status</th></tr></thead><tbody><tr><td>Kitchen Base Cabinet - Pull-out</td><td>${pill('Active').replace('Active','Added')}</td><td>1</td><td>${money(680)}</td><td>${money(680)}</td><td>Additional storage</td><td>${pill('Pending')}</td></tr><tr><td>Bathroom Faucet Upgrade</td><td>${pill('Partial').replace('Partial','Changed')}</td><td>2</td><td>${money(320)}</td><td>${money(640)}</td><td>Upgrade finishing</td><td>${pill('Pending')}</td></tr></tbody></table></div>`;
pages.po=()=>head('Purchase Order','Order materials or subcontractor work linked to the project.','PO > PO-2025-0057','<button class="btn red">Generate PO PDF</button> <button class="btn">Email Supplier</button> <button class="btn primary">Approve PO</button>')+
`<div class="grid four"><div class="card"><h3>Supplier</h3>Supply Builders Pte Ltd<br>James Tan<br>+65 6741 2233</div><div class="card"><h3>PO Info</h3>PO-2025-0057 ${pill('Draft')}<br>18 May 2025<br>Terms: 30 days</div><div class="card"><h3>Project</h3>Condo Renovation - 28A<br>Client: Jessica Tan</div><div class="card"><h3>Delivery</h3>05 Jun 2025<br>28A River Valley Road</div></div><br><div class="card"><h3>PO Items</h3><table><thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Unit Cost</th><th>Amount</th><th>Delivery</th></tr></thead><tbody>${[['Porcelain Tile','Tiles',120,28,3192,'05 Jun'],['Kitchen Cabinet Package','Carpentry',1,8500,8245,'15 Jun'],['Quartz Countertop','Stone',12,220,2904,'15 Jun'],['Labour - Tiling Works','Labour',1,1200,1200,'10 Jun']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${money(r[3])}</td><td>${money(r[4])}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table><br><div class="total">${money(17844.39)}</div></div>`;

`<div class="card"><div class="grid three"><div>${pill('Planning').replace('Planning','Scheduled')}<br>12 May 2025</div><div>${pill('Completed').replace('Completed','Delivered')}<br>14 May 2025</div><div>${pill('Completed').replace('Completed','Handover Complete')}<br>14 May 2025</div></div></div><br><div class="grid two"><div class="card"><h3>Completed Work Checklist</h3><table><thead><tr><th>Item</th><th>Spec</th><th>Status</th></tr></thead><tbody>${['Kitchen Cabinet','Kitchen Countertop','Wardrobe','Vanity Top','Tiling','Painting','Electrical Fittings','General Cleaning'].map(x=>`<tr><td>${x}</td><td>Completed as agreed</td><td>${pill('Completed')}</td></tr>`).join('')}</tbody></table></div><div class="card"><h3>Handover Confirmation</h3>Received by: Aiden Wong<br>NRIC: S1234567A<div class="upload" style="font-size:28px;font-family:cursive">Aiden Wong</div><br>${pill('Completed').replace('Completed','Handover Complete')}</div></div><br><div class="card"><h3>Attachments</h3><div class="uploads"><div class="thumb"></div><div class="thumb"></div><div class="upload">PDF Checklist</div></div></div>`;
