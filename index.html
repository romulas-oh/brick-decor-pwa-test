*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:'Segoe UI',Roboto,Arial,sans-serif;letter-spacing:.01em}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:266px;background:var(--nav);color:#fff;position:fixed;inset:0 auto 0 0;padding:24px 18px;overflow:auto}.main{margin-left:266px;width:calc(100% - 266px)}
.brand{display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:18px;margin-bottom:18px}.mark{width:38px;height:38px;border:1.8px solid var(--gold2);border-radius:9px;position:relative}.mark:before{content:"";position:absolute;left:7px;bottom:6px;width:22px;height:15px;border:1.8px solid var(--gold2)}.mark:after{content:"";position:absolute;left:10px;top:4px;width:16px;height:16px;border-left:1.8px solid var(--gold2);border-top:1.8px solid var(--gold2);transform:rotate(45deg);background:var(--nav)}.brand b{font-size:15px;letter-spacing:.16em}.nav button{display:block;width:100%;background:transparent;color:#D6DEE8;border:0;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0;font-weight:700;font-size:13px}.nav button:hover,.nav button.active{background:rgba(214,176,106,.13);border-left:3px solid var(--gold2);padding-left:11px;color:#fff}.note{margin-top:22px;background:linear-gradient(145deg,#14243A,#0E1A2B);border:1px solid rgba(214,176,106,.32);border-radius:16px;padding:18px;color:#fff}.note p{color:rgba(255,255,255,.72);font-size:11.5px;line-height:1.55}.top{height:74px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.search{width:360px;border:1px solid var(--line);border-radius:12px;padding:11px 15px;background:#FBFAF7}.content{padding:26px;max-width:1600px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.crumb{font-size:12px;color:var(--muted);margin-bottom:7px}h1{margin:0;font-size:28px;letter-spacing:-.03em}.sub{color:var(--muted);margin:4px 0 0}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:750;color:var(--text)}.btn.primary{background:#17202A;border-color:#17202A;color:#fff}.btn.gold{background:#9A6A2F;border-color:#9A6A2F;color:#fff}.btn.warn{border-color:#D6B06A;color:#7A5526;background:#FFFCF7}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.five{grid-template-columns:repeat(5,1fr)}.sidegrid{grid-template-columns:1fr 390px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.small{font-size:12px;color:var(--muted)}.money{font-size:23px;font-weight:900;margin:3px 0}.total{font-size:31px;color:#9A6A2F;font-weight:950}.pill{display:inline-flex;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:800}.green{background:#EAF8EF;color:var(--green)}.orange{background:#F8EEDC;color:var(--orange)}.red{background:#FFF1F1;color:var(--red)}.blue{background:#EAF1F7;color:var(--blue)}.gray{background:#F2F4F7;color:#64748b}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}th{background:#FAF8F4;color:#687083;font-size:12px}.tablewrap{border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:620px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:850;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.field textarea{min-height:92px}.full{grid-column:1/-1}.span2{grid-column:span 2}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:850}.tabs button.active{background:#17202A;color:#fff;border-color:#17202A}.notice{background:var(--soft);border:1px solid #E4D2B6;color:#68451D;border-radius:14px;padding:13px;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;width:min(1080px,96vw);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 24px 90px rgba(0,0,0,.25)}.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;border-radius:14px;padding:12px 16px;display:none;z-index:50}.logoImg{max-height:64px;max-width:220px;object-fit:contain;background:#fff}.docPreview{background:#fff;border:1px solid var(--line);padding:24px;font-family:Arial,sans-serif}.docPreview h2{text-align:center;margin:6px 0}.docHeader{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.docMeta{font-size:12px;text-align:right}.docBox{border:1px solid #222;border-collapse:collapse}.docBox td{border:1px solid #222;padding:5px;font-size:12px}.sectionRow{background:#E86E88;color:#fff;font-weight:bold}.amount{text-align:right}.danger{color:var(--red);font-weight:800;cursor:pointer}.link{color:var(--blue);font-weight:800;cursor:pointer}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}@media(max-width:1000px){.sidebar{position:static;width:100%}.main{margin-left:0;width:100%}.app{display:block}.two,.three,.four,.five,.sidegrid,.form{grid-template-columns:1fr}.top{height:auto;gap:12px;flex-wrap:wrap;padding:14px}.search{width:100%}.content{padding:14px}}

const $=id=>document.getElementById(id);const money=n=>'$ '+Number(n||0).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});const num=n=>Number(n||0);const today=()=>new Date().toISOString().slice(0,10);const ym=()=>{const d=new Date();return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')};const uid=p=>p+'-'+Math.random().toString(36).slice(2,7).toUpperCase();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}function modal(h){$('modalBody').innerHTML=h;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}document.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const NAV=[['dashboard','Dashboard'],['companies','Companies & Templates'],['projects','Projects / Cases'],['quotation','Quotation Structure'],['loa','Letter of Appointment'],['vo','Variation Order'],['invoice','Invoice / Receipt'],['handover','Handover Form'],['automation','Automation Controls']];
const seed={tab:'dashboard',companyId:'CO1',quoteId:'Q1',voId:'VO1',invoiceId:'INV1',handoverId:'H1',settings:{gstRate:9,docFormat:'Short prefix + YYMM + running number',paymentTerms:[{name:'Down payment',pct:10,rule:'10% of contract sum or S$1,000 whichever is greater'},{name:'Upon commencement of work',pct:45,rule:'45% of contract sum'},{name:'Upon measurement of carpentry works',pct:40,rule:'40% of contract sum'},{name:'Upon completion / handover',pct:5,rule:'Usually collected same day as handover'}]},companies:[
{id:'CO1',name:'Brick & Decor (Central) Pte Ltd',short:'BDC',uen:'202242361M',gst:'GST',address:'26 Sin Ming Lane #01-113, Midview City S(573971)',email:'enquiry@brickndecor.com.sg',phone:'8482 9049',bank:'OCBC: 595-171604-001',paynow:'202242361M',logo:'assets/logo-central.jpeg',prefix:'BDC',terms:'Standard Terms & Conditions: payment schedule follows 10% / 45% / 40% / 5%. Warranty wording remains in documents if applicable. Any variation must be confirmed by VO.'},
{id:'CO2',name:'BD Werks Pte Ltd',short:'BDW',uen:'202411448N',gst:'NON GST',address:'26 Sin Ming Lane #01-112, Midview City S(573971)',email:'enquiry@brickndecor.com.sg',phone:'8482 9049',bank:'OCBC: 596-503052-001',paynow:'202242361M',logo:'assets/logo-bdwerks.png',prefix:'BDW',terms:'Standard Terms & Conditions editable by Superadmin. Non-GST company template.'},
{id:'CO3',name:'Brick & Decor (North) Pte Ltd',short:'BDN',uen:'202415736H',gst:'NON GST',address:'26 Sin Ming Lane #01-118, Midview City S(573971)',email:'enquiry@brickndecor.com.sg',phone:'8482 9049',bank:'OCBC: 602-090193-001',paynow:'202415736H',logo:'assets/logo-north.png',prefix:'BDN',terms:'Standard Terms & Conditions editable by Superadmin. Non-GST company template.'},
{id:'CO4',name:'Arc & Brush',short:'AB',uen:'53493225L',gst:'NON GST',address:'26 Sin Ming Lane #01-118, Midview City S(573971)',email:'enquiry@brickndecor.com.sg',phone:'8482 9049',bank:'OCBC: 602-642944-001',paynow:'53493225L',logo:'assets/logo-arcbrush.jpg',prefix:'AB',terms:'Standard Terms & Conditions editable by Superadmin. Arc & Brush template.'}],

{area:'Kitchen',section:'Carpentry Works',item:'Design, fabricate & install kitchen bottom cabinet',desc:'E1 plywood internal, laminate finish, soft closing hinges.',qty:1,unit:'lot',pricingType:'Amount',price:1485,cost:900},

let state=JSON.parse(localStorage.getItem('bd-v06-doc-structure')||'null')||seed;
function save(){localStorage.setItem('bd-v06-doc-structure',JSON.stringify(state))}function reset(){if(confirm('Reset demo data?')){localStorage.removeItem('bd-v06-doc-structure');state=JSON.parse(JSON.stringify(seed));render();toast('Reset done')}}function co(id=state.companyId){return state.companies.find(c=>c.id===id)||state.companies[0]}function project(id=state.projects[0].id){return state.projects.find(p=>p.id===id)||state.projects[0]}function quote(){return state.quotes.find(q=>q.id===state.quoteId)||state.quotes[0]}function vo(){return state.vos.find(v=>v.id===state.voId)||state.vos[0]}function inv(){return state.invoices.find(i=>i.id===state.invoiceId)||state.invoices[0]}function hdo(){return state.handover.find(h=>h.id===state.handoverId)||state.handover[0]}function isGST(c){return c.gst==='GST'}function gstAmount(c,subtotal){return isGST(c)?subtotal*(state.settings.gstRate/100):0}function scopeSubtotal(scope){return scope.reduce((a,x)=>a+(x.pricingType==='Amount'?num(x.price)*num(x.qty):0),0)}function internalCost(scope){return scope.reduce((a,x)=>a+num(x.cost)*num(x.qty),0)}function quoteTotal(q=quote()){const c=co(q.companyId),sub=scopeSubtotal(q.scope)-num(q.discount);return sub+gstAmount(c,sub)}function paymentSchedule(total){return state.settings.paymentTerms.map((p,i)=>{let amt=total*p.pct/100;if(i===0)amt=Math.max(amt,1000);return {...p,amount:amt}})}function priceText(x){return x.pricingType==='Amount'?money(num(x.price)*num(x.qty)):x.pricingType}function classP(s){return s==='GST'||s==='Paid'||s==='Active'?'green':s==='Draft'?'gray':s==='NON GST'?'blue':'orange'}function pill(s){return `<span class="pill ${classP(s)}">${esc(s)}</span>`}function header(t,s,a=''){return `<div class="head"><div><div class="crumb">Brick & Decor PWA v0.6</div><h1>${esc(t)}</h1><p class="sub">${esc(s)}</p></div><div class="actions">${a}</div></div>`}function layout(body){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="mark"></div><b>BRICK & DECOR</b></div><nav class="nav">${NAV.map(n=>`<button class="${state.tab===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><div class="note"><b>v0.6 Document Structure</b><p>Actual company details, logo selection, Area / Section / Item quotation structure, LOA, VO, invoice receipt and flexible templates.</p></div></aside><main class="main"><div class="top"><input class="search" placeholder="Search / test field"><div class="toolbar"><select onchange="state.companyId=this.value;save();render()">${state.companies.map(c=>`<option value="${c.id}" ${state.companyId===c.id?'selected':''}>${c.short} - ${c.name}</option>`).join('')}</select><button class="btn small" onclick="exportData()">Export</button><button class="btn small" onclick="reset()">Reset</button></div></div><div class="content">${body}</div></main></div>`}
function go(t){state.tab=t;save();render()}function render(){$('app').innerHTML=layout(pages[state.tab]());save()}function formField(id,label,value='',type='text',opts=[]){if(type==='textarea')return `<div class="field full"><label>${esc(label)}</label><textarea id="${id}">${esc(value)}</textarea></div>`;if(type==='select')return `<div class="field"><label>${esc(label)}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o)}" ${o==value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;return `<div class="field"><label>${esc(label)}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}
function companyCard(c){return `<div class="card"><img class="logoImg" src="${esc(c.logo)}"><h3>${esc(c.name)}</h3><p class="small">UEN: ${esc(c.uen)} · ${pill(c.gst)}</p><p>${esc(c.address)}</p><p class="small">${esc(c.email)} · ${esc(c.phone)}<br>${esc(c.bank)}<br>PayNow: ${esc(c.paynow)}</p><button class="btn small" onclick="editCompany('${c.id}')">Edit Template</button></div>`}
const pages={};
pages.dashboard=()=>{const q=quote(),c=co(q.companyId),sub=scopeSubtotal(q.scope),cost=internalCost(q.scope);return header('Dashboard','Document-structure test using actual company master and real sample flow.','<button class="btn primary" onclick="go(\'quotation\')">Open Quotation</button>')+`<div class="grid five"><div class="card"><div class="small">Companies</div><div class="money">${state.companies.length}</div></div><div class="card"><div class="small">Quotation Subtotal</div><div class="money">${money(sub)}</div></div><div class="card"><div class="small">GST Mode</div><div class="money">${c.gst}</div></div><div class="card"><div class="small">Internal Cost</div><div class="money">${money(cost)}</div></div><div class="card"><div class="small">Estimated Profit</div><div class="money">${money(sub-cost)}</div></div></div><br><div class="grid two"><div class="card"><h3>Confirmed Design Rules</h3><table><tr><td>Document numbering</td><td>Short format: Prefix + document type + YYMM + running no.</td></tr><tr><td>Warranty</td><td>Module removed, wording can remain inside editable templates.</td></tr><tr><td>Templates</td><td>Superadmin edits company template; ID follows selected template.</td></tr><tr><td>Pricing type</td><td>Amount / Inclusive / Complimentary / F.O.C / Optional, with hidden internal cost allowed as 0.</td></tr></table></div><div class="card"><h3>Automation to Reduce Human Error</h3><ol><li>Company selection auto-fills logo, GST, UEN, address and bank details.</li><li>GST auto-calculates only for GST company.</li><li>Payment schedule auto-creates 10% / 45% / 40% / 5%.</li><li>VO pulls original contract amount and recalculates grand total.</li><li>Invoice amount auto-pulls from payment stage.</li></ol></div></div>`}
pages.companies=()=>header('Companies & Templates','Company master with editable document terms. ID users only select company/template; Superadmin controls wording.')+`<div class="grid four">${state.companies.map(companyCard).join('')}</div><br><div class="card"><h3>Payment Terms Template</h3><table><thead><tr><th>Stage</th><th>%</th><th>Rule</th></tr></thead><tbody>${state.settings.paymentTerms.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.pct}%</td><td>${esc(t.rule)}</td></tr>`).join('')}</tbody></table></div>`;
function editCompany(id){const c=co(id);modal(`<h2>Edit Company Template</h2><div class="form">${formField('ec_name','Company Name',c.name)}${formField('ec_prefix','Document Prefix',c.prefix)}${formField('ec_gst','GST Status',c.gst,'select',['GST','NON GST'])}${formField('ec_addr','Address',c.address,'textarea')} ${formField('ec_terms','Terms & Conditions Template',c.terms,'textarea')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveCompany('${id}')">Save</button>`)}window.editCompany=editCompany;window.saveCompany=id=>{const c=co(id);c.name=$('ec_name').value;c.prefix=$('ec_prefix').value;c.gst=$('ec_gst').value;c.address=$('ec_addr').value;c.terms=$('ec_terms').value;closeModal();toast('Company/template saved');render()}
pages.projects=()=>header('Projects / Cases','Project data required to auto-create quotation, LOA, VO, invoice and handover documents.','<button class="btn primary" onclick="editProject()">Edit Project</button>')+`<div class="card"><h3>Project Case</h3>${projectTable(project())}</div>`;function projectTable(p){return `<table><tr><th>Client</th><td>${esc(p.client)}</td><th>NRIC / UEN</th><td>${esc(p.nric)}</td></tr><tr><th>Contact</th><td>${esc(p.phone)}</td><th>Email</th><td>${esc(p.email)}</td></tr><tr><th>Address</th><td colspan="3">${esc(p.address)}</td></tr><tr><th>Designer</th><td>${esc(p.designer)}</td><th>Designer Contact</th><td>${esc(p.designerContact)}</td></tr><tr><th>Company</th><td>${esc(co(p.companyId).name)}</td><th>Status</th><td>${pill(p.status)}</td></tr></table>`}function editProject(){const p=project();modal(`<h2>Edit Project / Case</h2><div class="form">${formField('p_client','Client Name',p.client)}${formField('p_nric','NRIC / UEN',p.nric)}${formField('p_phone','Phone',p.phone)}${formField('p_email','Email',p.email)}${formField('p_designer','Designer / ID',p.designer)}${formField('p_designerContact','Designer Mobile',p.designerContact)}${formField('p_addr','Project Address',p.address,'textarea')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveProject()">Save Project</button>`)}window.editProject=editProject;window.saveProject=()=>{const p=project();['client','nric','phone','email','designer','designerContact'].forEach(k=>p[k]=$('p_'+k).value);p.address=$('p_addr').value;closeModal();toast('Project saved');render()}
pages.quotation=()=>{const q=quote(),c=co(q.companyId),p=project(q.projectId),sub=scopeSubtotal(q.scope),disc=num(q.discount),gst=gstAmount(c,sub-disc),total=sub-disc+gst;return header('Quotation Structure','Area / Location → Work Section → Item. This matches their current quotation style such as Kitchen 1, Kitchen Wall, Bathroom, Window Works.','<button class="btn" onclick="addScope()">Add Scope Line</button><button class="btn warn" onclick="printQuote()">Print Preview</button>')+`<div class="grid sidegrid"><div><div class="card"><div class="toolbar"><label>Document Company</label><select onchange="quote().companyId=this.value;render()">${state.companies.map(x=>`<option value="${x.id}" ${x.id===q.companyId?'selected':''}>${x.short} - ${x.name}</option>`).join('')}</select><label>Doc No</label><input value="${esc(q.docNo)}" onchange="quote().docNo=this.value;render()"><label>Date</label><input type="date" value="${esc(q.date)}" onchange="quote().date=this.value;render()"></div></div><br><div class="card"><h3>Scope of Works Builder</h3><div class="tablewrap"><table><thead><tr><th>Area / Location</th><th>Work Section</th><th>Item / Description</th><th>Qty</th><th>Pricing Type</th><th>Client Amount</th><th>Internal Cost</th><th></th></tr></thead><tbody>${q.scope.map((x,i)=>`<tr><td><input value="${esc(x.area)}" onchange="editScope(${i},'area',this.value)"></td><td><input value="${esc(x.section)}" onchange="editScope(${i},'section',this.value)"></td><td><b><input value="${esc(x.item)}" onchange="editScope(${i},'item',this.value)"></b><br><textarea onchange="editScope(${i},'desc',this.value)">${esc(x.desc)}</textarea></td><td><input type="number" value="${x.qty}" style="width:65px" onchange="editScope(${i},'qty',this.value)"><br><input value="${esc(x.unit)}" style="width:65px" onchange="editScope(${i},'unit',this.value)"></td><td><select onchange="editScope(${i},'pricingType',this.value)">${['Amount','Inclusive','Complimentary','F.O.C','Optional'].map(t=>`<option ${t===x.pricingType?'selected':''}>${t}</option>`).join('')}</select></td><td><input type="number" value="${x.price}" style="width:105px" onchange="editScope(${i},'price',this.value)"><br><span class="small">Shows: ${esc(priceText(x))}</span></td><td><input type="number" value="${x.cost}" style="width:95px" onchange="editScope(${i},'cost',this.value)"><br><span class="small">Can be 0</span></td><td><span class="danger" onclick="delScope(${i})">Delete</span></td></tr>`).join('')}</tbody></table></div></div><br><div class="card"><h3>Document Preview Structure</h3>${quotationPreview(q,false)}</div></div><div><div class="card"><h3>Summary</h3><div class="small">Company</div><b>${esc(c.name)}</b><br><br><div class="small">Subtotal</div><div class="money">${money(sub)}</div><div class="small">Discount</div><input type="number" value="${q.discount}" onchange="quote().discount=this.value;render()"><br><br><div class="small">GST ${isGST(c)?state.settings.gstRate+'%':'0% Non-GST'}</div><div class="money">${money(gst)}</div><div class="small">Grand Total</div><div class="total">${money(total)}</div></div><br><div class="card"><h3>Auto Payment Schedule</h3>${paymentTable(total)}</div></div></div>`}
function paymentTable(total){return `<table>${paymentSchedule(total).map((x,i)=>`<tr><td>${i+1}. ${esc(x.name)}</td><td>${x.pct}%</td><td class="amount">${money(x.amount)}</td></tr>`).join('')}</table>`}
window.editScope=(i,k,v)=>{const x=quote().scope[i];x[k]=['qty','price','cost'].includes(k)?num(v):v;save();render()};window.delScope=i=>{quote().scope.splice(i,1);toast('Line deleted');render()};window.addScope=()=>modal(`<h2>Add Scope Line</h2><div class="form">${formField('s_area','Area / Location','Kitchen 1')}${formField('s_section','Work Section','Hacking Works')}${formField('s_item','Item Name','Supply labour and material')}${formField('s_qty','Qty','1','number')}${formField('s_unit','Unit','lot')}${formField('s_type','Pricing Type','Amount','select',['Amount','Inclusive','Complimentary','F.O.C','Optional'])}${formField('s_price','Selling Price','0','number')}${formField('s_cost','Internal Cost','0','number')}${formField('s_desc','Description','Description shown in quotation','textarea')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveScope()">Add</button>`);window.saveScope=()=>{quote().scope.push({area:$('s_area').value,section:$('s_section').value,item:$('s_item').value,desc:$('s_desc').value,qty:num($('s_qty').value)||1,unit:$('s_unit').value,pricingType:$('s_type').value,price:num($('s_price').value),cost:num($('s_cost').value)});closeModal();toast('Scope added');render()}
function groupScope(scope){let out='',lastA='',lastS='';scope.forEach((x,i)=>{if(x.area!==lastA){out+=`<tr class="sectionRow"><td colspan="4">${esc(x.area)}</td></tr>`;lastA=x.area;lastS=''} if(x.section!==lastS){out+=`<tr><td colspan="4"><b>${esc(x.section)}</b></td></tr>`;lastS=x.section}out+=`<tr><td style="width:45px">${i+1}</td><td>${esc(x.item)}<br><span class="small">${esc(x.desc)}</span></td><td>${esc(x.qty)} ${esc(x.unit)}</td><td class="amount">${esc(priceText(x))}</td></tr>`});return out}
function quotationPreview(q,full=true){const c=co(q.companyId),p=project(q.projectId),sub=scopeSubtotal(q.scope),disc=num(q.discount),gst=gstAmount(c,sub-disc),total=sub-disc+gst;return `<div class="docPreview"><div class="docHeader"><div><img class="logoImg" src="${esc(c.logo)}"></div><div class="docMeta"><b>${esc(c.name)}</b><br>Co. Reg: ${esc(c.uen)}<br>${isGST(c)?'GST Reg Number: '+esc(c.uen):'Non-GST'}<br>${esc(c.address)}<br>Tel: ${esc(c.phone)}</div></div><table class="docBox" style="width:100%;margin-top:12px"><tr><td>Name</td><td>${esc(p.client)}</td><td>Quotation No</td><td>${esc(q.docNo)}</td></tr><tr><td>NRIC</td><td>${esc(p.nric)}</td><td>Date</td><td>${esc(q.date)}</td></tr><tr><td>Address</td><td>${esc(p.address)}</td><td>Served By</td><td>${esc(q.servedBy||p.designer)}</td></tr><tr><td>H/P</td><td>${esc(p.phone)}</td><td>Mobile No</td><td>${esc(p.designerContact)}</td></tr></table><h2>QUOTATION FOR THE INTERIOR DESIGN WORKS</h2><table style="width:100%"><thead><tr><th>Item No</th><th>Scope of Works</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${groupScope(q.scope)}</tbody></table><br><table style="width:320px;margin-left:auto"><tr><td>Subtotal</td><td class="amount">${money(sub)}</td></tr><tr><td>Discount</td><td class="amount">${money(disc)}</td></tr><tr><td>GST</td><td class="amount">${money(gst)}</td></tr><tr><th>Grand Total</th><th class="amount">${money(total)}</th></tr></table>${full?`<p class="small">Terms: ${esc(c.terms)}</p>`:''}</div>`}
window.printQuote=()=>printHTML('Quotation '+quote().docNo,quotationPreview(quote(),true));
pages.loa=()=>{const q=quote(),p=project(q.projectId),c=co(q.companyId),total=quoteTotal(q);return header('Letter of Appointment','Auto generated after client accepts quotation. Text remains flexible and editable by Superadmin/company template.')+`<div class="grid sidegrid"><div class="card"><h3>LOA Settings</h3><div class="form">${formField('loa_fee','Design Fee / Acceptance Fee',q.loa.designFee,'number')}${formField('loa_months','Appointment Valid Months',q.loa.appointmentMonths,'number')}${formField('loa_body','LOA Body Text',q.loa.body,'textarea')}</div><br><button class="btn primary" onclick="saveLOA()">Save LOA Text</button> <button class="btn warn" onclick="printLOA()">Print LOA</button></div><div class="card"><h3>LOA Preview</h3>${loaPreview(q,p,c,total)}</div></div>`};window.saveLOA=()=>{quote().loa.designFee=num($('loa_fee').value);quote().loa.appointmentMonths=num($('loa_months').value);quote().loa.body=$('loa_body').value;toast('LOA saved');render()};function loaPreview(q,p,c,total){return `<div class="docPreview"><div class="docHeader"><img class="logoImg" src="${esc(c.logo)}"><div class="docMeta"><b>${esc(c.name)}</b><br>${esc(c.address)}<br>${esc(c.phone)}</div></div><h1>Letter of Appointment</h1><p>I/We: <u>${esc(p.client)}</u></p><p>NRIC No: <u>${esc(p.nric)}</u></p><p>Hereby officially appoint ${esc(c.name)} as Interior Designer for our new premise at <u>${esc(p.address)}</u>.</p><p>A design fee of SGD <u>${money(q.loa.designFee)}</u> is paid for acceptance and confirmation.</p><p>Budget amount estimated at SGD <u>${money(total)}</u>.</p><p>${esc(q.loa.body)}</p><br><table style="width:100%"><tr><td>Interior Designer Signature / Date</td><td>Client Signature / Date</td></tr><tr><td style="height:70px"></td><td></td></tr></table></div>`}window.printLOA=()=>printHTML('Letter of Appointment',loaPreview(quote(),project(quote().projectId),co(quote().companyId),quoteTotal()))
pages.vo=()=>{const v=vo(),p=project(v.projectId),c=co(v.companyId),add=scopeSubtotal(v.additional),can=scopeSubtotal(v.cancel),net=add-can,gst=gstAmount(c,net),total=net+gst,grand=num(v.originalAmount)+total;return header('Variation Order','Flexible VO with additional items and cancellation items. Original contract and payment summary are auto pulled.')+`<div class="grid sidegrid"><div><div class="card"><div class="toolbar"><label>VO No</label><input value="${esc(v.docNo)}" onchange="vo().docNo=this.value;render()"><label>Original Contract Amount</label><input type="number" value="${v.originalAmount}" onchange="vo().originalAmount=this.value;render()"><button class="btn" onclick="addVOLine('additional')">Add Additional</button><button class="btn" onclick="addVOLine('cancel')">Add Cancellation</button><button class="btn warn" onclick="printVO()">Print VO</button></div></div><br><div class="card"><h3>Additional Items</h3>${lineTable(v.additional,'additional')}</div><br><div class="card"><h3>Cancellation Items</h3>${lineTable(v.cancel,'cancel')}</div></div><div><div class="card"><h3>VO Summary</h3><table><tr><td>Original Contract</td><td class="amount">${money(v.originalAmount)}</td></tr><tr><td>Additional Subtotal</td><td class="amount">${money(add)}</td></tr><tr><td>Cancellation Subtotal</td><td class="amount">${money(can)}</td></tr><tr><td>Net VO</td><td class="amount">${money(net)}</td></tr><tr><td>GST</td><td class="amount">${money(gst)}</td></tr><tr><th>VO Total</th><th class="amount">${money(total)}</th></tr><tr><th>Grand Total</th><th class="amount">${money(grand)}</th></tr></table></div><br><div class="card"><h3>Auto Payment Schedule After VO</h3>${paymentTable(grand)}</div></div></div>`};function lineTable(arr,type){return `<div class="tablewrap"><table><thead><tr><th>Area</th><th>Section</th><th>Item / Desc</th><th>Pricing</th><th>Amount</th><th>Cost</th><th></th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${esc(x.area)}</td><td>${esc(x.section)}</td><td><b>${esc(x.item)}</b><br><span class="small">${esc(x.desc)}</span></td><td>${esc(x.pricingType)}</td><td>${priceText(x)}</td><td>${money(num(x.cost)*num(x.qty))}</td><td><span class="danger" onclick="delVOLine('${type}',${i})">Delete</span></td></tr>`).join('')}</tbody></table></div>`}window.delVOLine=(type,i)=>{vo()[type].splice(i,1);render()};window.addVOLine=type=>modal(`<h2>Add ${type==='additional'?'Additional':'Cancellation'} VO Item</h2><div class="form">${formField('v_area','Area','A/C Works')}${formField('v_section','Section',type==='additional'?'Additional Item':'Cancellation Item')}${formField('v_item','Item','New VO item')}${formField('v_qty','Qty','1','number')}${formField('v_unit','Unit','lot')}${formField('v_type','Pricing Type','Amount','select',['Amount','Inclusive','Complimentary','F.O.C','Optional'])}${formField('v_price','Selling Price','0','number')}${formField('v_cost','Internal Cost','0','number')}${formField('v_desc','Description','VO description','textarea')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveVOLine('${type}')">Add</button>`);window.saveVOLine=type=>{vo()[type].push({area:$('v_area').value,section:$('v_section').value,item:$('v_item').value,desc:$('v_desc').value,qty:num($('v_qty').value)||1,unit:$('v_unit').value,pricingType:$('v_type').value,price:num($('v_price').value),cost:num($('v_cost').value)});closeModal();render()};function voPreview(){const v=vo(),q=quote(),p=project(v.projectId),c=co(v.companyId),add=scopeSubtotal(v.additional),can=scopeSubtotal(v.cancel),net=add-can,gst=gstAmount(c,net),total=net+gst,grand=num(v.originalAmount)+total;return `<div class="docPreview"><div class="docHeader"><img class="logoImg" src="${esc(c.logo)}"><div class="docMeta"><b>${esc(c.name)}</b><br>Co Reg: ${esc(c.uen)}<br>${esc(c.address)}</div></div><table class="docBox" style="width:100%;margin-top:12px"><tr><td>Name</td><td>${esc(p.client)}</td><td>Agreement No</td><td>${esc(v.docNo)}</td></tr><tr><td>Address</td><td>${esc(p.address)}</td><td>Date</td><td>${esc(v.date)}</td></tr></table><h2>VARIATION ORDER CONTRACT</h2><p>Total amount signed as per agreement: ${money(v.originalAmount)}</p><h3>Additional Items</h3><table style="width:100%"><tbody>${groupScope(v.additional)}</tbody></table><h3>Cancellation Items</h3><table style="width:100%"><tbody>${groupScope(v.cancel)}</tbody></table><table style="width:360px;margin-left:auto"><tr><td>Variation Subtotal</td><td class="amount">${money(net)}</td></tr><tr><td>GST</td><td class="amount">${money(gst)}</td></tr><tr><th>Total Variation</th><th class="amount">${money(total)}</th></tr><tr><th>Grand Total</th><th class="amount">${money(grand)}</th></tr></table></div>`}window.printVO=()=>printHTML('Variation Order '+vo().docNo,voPreview())
pages.invoice=()=>{const i=inv(),q=quote(),p=project(i.projectId),c=co(i.companyId),total=quoteTotal(q),sched=paymentSchedule(total),stage=sched.find(x=>x.name===i.stage)||sched[0],amount=stage.amount,tax=isGST(c)?amount*state.settings.gstRate/(100+state.settings.gstRate):0,unit=amount-tax,due=amount-num(i.amountPaid);return header('Invoice / Official Receipt','Invoice amount auto-pulls from selected payment stage. GST and amount due are calculated automatically.')+`<div class="grid sidegrid"><div><div class="card"><h3>Invoice Fields</h3><div class="form">${formField('inv_stage','Payment Stage',i.stage,'select',sched.map(x=>x.name))}${formField('inv_date','Invoice Date',i.date,'date')}${formField('inv_due','Due Date',i.dueDate,'date')}${formField('inv_paid','Less Amount Paid',i.amountPaid,'number')}${formField('inv_method','Payment Method',i.method)}${formField('inv_receipt','Receipt No',i.receiptNo)}</div><br><button class="btn primary" onclick="saveInvoice()">Save Invoice</button> <button class="btn warn" onclick="printInvoice()">Print Invoice</button></div><br><div class="card"><h3>Invoice Preview</h3>${invoicePreview(false)}</div></div><div><div class="card"><h3>Auto Calculation</h3><table><tr><td>Description</td><td>${esc(i.stage)} for ${esc(p.address)}</td></tr><tr><td>Unit Price before GST</td><td>${money(unit)}</td></tr><tr><td>Tax</td><td>${money(tax)}</td></tr><tr><td>Total</td><td>${money(amount)}</td></tr><tr><td>Less Paid</td><td>${money(i.amountPaid)}</td></tr><tr><th>Amount Due</th><th>${money(due)}</th></tr></table></div></div></div>`};window.saveInvoice=()=>{const i=inv();i.stage=$('inv_stage').value;i.date=$('inv_date').value;i.dueDate=$('inv_due').value;i.amountPaid=num($('inv_paid').value);i.method=$('inv_method').value;i.receiptNo=$('inv_receipt').value;toast('Invoice saved');render()};function invoicePreview(full=true){const i=inv(),q=quote(),p=project(i.projectId),c=co(i.companyId),total=quoteTotal(q),stage=paymentSchedule(total).find(x=>x.name===i.stage)||paymentSchedule(total)[0],amount=stage.amount,tax=isGST(c)?amount*state.settings.gstRate/(100+state.settings.gstRate):0,unit=amount-tax,due=amount-num(i.amountPaid);return `<div class="docPreview"><h3>PAYMENT ADVICE</h3><p>To: ${esc(c.name)}<br>${esc(c.address)}</p><p>Customer: ${esc(p.address)}<br>Invoice Number: ${esc(i.docNo)}<br>Amount Due: ${money(due)}<br>Due Date: ${esc(i.dueDate)}</p><hr><h2>INV/OFFICIAL RECEIPT</h2><div class="docHeader"><div>${esc(p.address)}</div><div class="docMeta"><b>${esc(c.name)}</b><br>${esc(c.address)}</div></div><table style="width:100%;margin-top:12px"><thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Tax</th><th>Amount SGD</th></tr></thead><tbody><tr><td>${esc(stage.pct+'% Payment for '+p.address)}</td><td>1.00</td><td>${money(unit)}</td><td>${isGST(c)?state.settings.gstRate+'%':'0%'}</td><td>${money(unit)}</td></tr></tbody></table><table style="width:360px;margin-left:auto"><tr><td>Subtotal</td><td class="amount">${money(unit)}</td></tr><tr><td>GST</td><td class="amount">${money(tax)}</td></tr><tr><th>Total SGD</th><th class="amount">${money(amount)}</th></tr><tr><td>Less Amount Paid</td><td class="amount">${money(i.amountPaid)}</td></tr><tr><th>Amount Due</th><th class="amount">${money(due)}</th></tr></table></div>`}window.printInvoice=()=>printHTML('Invoice '+inv().docNo,invoicePreview(true))
pages.handover=()=>{const h=hdo(),p=project(h.projectId),c=co(h.companyId);return header('Handover House Key Form','Flexible handover form under DO/Handover. It pulls customer/project/designer automatically.')+`<div class="grid sidegrid"><div class="card"><h3>Handover Fields</h3><div class="form">${formField('h_date','Handover Date',h.date,'date')}${formField('h_client','Client Signature Text',h.clientSignature)}${formField('h_consultant','Consultant Signature Text',h.consultantSignature)}${formField('h_manager','Manager Signature Text',h.managerSignature)}${formField('h_remarks','Remarks',h.remarks,'textarea')}</div><br><button class="btn primary" onclick="saveHandover()">Save Handover</button> <button class="btn warn" onclick="printHandover()">Print Handover</button></div><div class="card"><h3>Preview</h3>${handoverPreview(false)}</div></div>`};window.saveHandover=()=>{const h=hdo();h.date=$('h_date').value;h.clientSignature=$('h_client').value;h.consultantSignature=$('h_consultant').value;h.managerSignature=$('h_manager').value;h.remarks=$('h_remarks').value;toast('Handover saved');render()};function handoverPreview(){const h=hdo(),p=project(h.projectId),c=co(h.companyId);return `<div class="docPreview"><div class="docHeader"><img class="logoImg" src="${esc(c.logo)}"><div class="docMeta"><b>${esc(c.name)}</b><br>${esc(c.address)}</div></div><h1>Handover House Key Form</h1><p><b>Customer:</b> ${esc(p.client)}</p><p><b>Email:</b> ${esc(p.email)}</p><p><b>Contact No.:</b> ${esc(p.phone)}</p><p><b>Address:</b> ${esc(p.address)}</p><p><b>Designer:</b> ${esc(p.designer)}</p><br><table style="width:100%"><tr><td>Acknowledge by Client / Date</td><td>${esc(h.clientSignature)} / ${esc(h.date)}</td></tr><tr><td>Consultant Signature / Date</td><td>${esc(h.consultantSignature)} / ${esc(h.date)}</td></tr><tr><td>Manager Signature / Date</td><td>${esc(h.managerSignature)} / ${esc(h.date)}</td></tr></table><p class="small">${esc(h.remarks)}</p></div>`}window.printHandover=()=>pr
