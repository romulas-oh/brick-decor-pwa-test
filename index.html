</div>'}
<br><div class="card"><h3>Version History</h3><table><tr><th>Version</th><th>Date Sent</th><th>Template</th><th>Total</th><th>By</th></tr>${q.versions.map(v=>`<tr><td>${v.v}</td><td>${v.date}</td><td>${v.template}</td><td>${money(v.total)}</td><td>${v.by}</td></tr>`).join('')||'<tr><td colspan="5">No sent version yet</td></tr>'}</table></div>
</div><div class="card"><h3>Quotation Summary</h3><div class="small">Document No.</div><b>${q.id}</b><br><br><div class="small">Template</div><select onchange="q.template=this.value;save();show('quotation')">${S.settings.templates.map(t=>`<option ${t==q.template?'selected':''}>${t}</option>`).join('')}</select><br><br><div class="small">Internal Cost</div><div class="money">${money(qcost(q))}</div><br><div class="small">Subtotal</div><div class="money">${money(qtot(q))}</div><br>${field('q_discount','Discount',q.discount,'number')}<button class="btn s" onclick="q.discount=+$('q_discount').value||0;show('quotation')">Apply Discount</button><br><br><div class="small">GST ${c.gstRate||0}%</div><div class="money">${money(qgst(q))}</div><br><div class="small">Grand Total</div><div class="total">${money(qgrand(q))}</div><br>${allValid?pill('Approved').replace('Approved','Price validation passed'):pill('Pending').replace('Pending','Check price range')}<br><br><h3>Auto Payment Schedule</h3><table>${paymentSchedule(q).map(x=>`<tr><td>${x.pct}%</td><td>${esc(x.label)}</td><td>${money(x.amount)}</td></tr>`).join('')}</table></div></div>`}
function editQuoteHeader(){let q=S.quotes.find(x=>x.id==qDetail),m=q.clientMeta;modal(`<h2>Edit Quotation Header / Client Data</h2><div class="form">${field('qh_name','Client Name',m.name)}${field('qh_nric','NRIC / UEN',m.nric)}${field('qh_phone','H/P / Contact No.',m.phone)}${field('qh_email','Fax / Email',m.email)}${field('qh_addr','Project Address',m.address,'textarea','','full')}${field('qh_post','Postal Code',m.postal)}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveQuoteHeader()">Save Header</button>`)}
function saveQuoteHeader(){let q=S.quotes.find(x=>x.id==qDetail);q.clientMeta={name:$('qh_name').value,nric:$('qh_nric').value,phone:$('qh_phone').value,email:$('qh_email').value,address:$('qh_addr').value,postal:$('qh_post').value};q.client=q.clientMeta.name;closeModal();show('quotation')}
function newQuote(){let ps=S.projects.filter(canP).filter(p=>p.status!='Closed');modal(`<h2>New Quotation</h2><div class="form">${field('nq_p','Project / Case',ps[0]?.id||'','select',ps.map(p=>p.id).join('|'))}${field('nq_t','Quotation Template',S.settings.templates[0],'select',S.settings.templates.join('|'))}</div><div class="warnbox">Client/company data will be copied from the case as a quotation snapshot so future case edits do not silently change a previously sent quotation.</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveNewQuote()">Create Quotation</button>`)}
function saveNewQuote(){let p=S.projects.find(x=>x.id==$('nq_p').value),q={id:docNo('Q',p.co),p:p.id,co:p.co,client:p.client,project:p.name,idUser:p.idUser,status:'Draft',created:today(),lastSent:'',template:$('nq_t').value,versions:[],discount:0,clientMeta:{name:p.client,nric:p.nric||'',address:p.site||'',postal:p.postal||'',phone:p.phone||'',email:p.email||''},items:[]};S.quotes.push(q);qDetail=q.id;closeModal();show('quotation')}
function editQI(n,k,v){let q=S.quotes.find(x=>x.id==qDetail);q.items[n][k]=['qty','cost','price'].includes(k)?Number(v)||0:v;show('quotation')}
function addQItem(){let q=S.quotes.find(x=>x.id==qDetail),areas=[...new Set(q.items.map(i=>i.area).filter(Boolean))],secs=S.settings.scopeSections||[];modal(`<h2>Add Quotation Item</h2><div class="form">${field('qi_area','Area / Location',areas[0]||'Kitchen 1')}${field('qi_section','Work Section',secs[0]||'Hacking Works')}${field('qi_mode','Item Type','Custom Item|Select Master Item','select')}${field('qi_master','Master Item','I1','select',S.items.map(i=>i.id).join('|'))}${field('qi_name','Client-facing Item Name','Custom Cabinet / Special Work')}${field('qi_cat','Internal Category','Carpentry|Electrical|Tiles|Surface|Reinstatement|Other','select')}${field('qi_pricing','Pricing Type','Amount|Inclusive|Complimentary|F.O.C|Optional','select')}${field('qi_unit','Unit','Lot')}${field('qi_qty','Qty','1','number')}${field('qi_cost','Internal Approx Cost','0','number')}${field('qi_price','Selling Price','0','number')}${field('qi_save','Save Custom Item to Master?','No|Yes','select')}${field('qi_desc','Detailed Description / Client Wording','Enter client-facing description.','textarea','', 'full')}</div><div class="warnbox">Area and Work Section are free text. This allows Kitchen 1 / Kitchen Wall 2 / Master Bedroom etc. while still letting Superadmin maintain common work-section wording in Master Data.</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveQItem()">Add Item</button>`)}
function saveQItem(){let q=S.quotes.find(x=>x.id==qDetail),it,area=$('qi_area').value,section=$('qi_section').value,ptype=$('qi_pricing').value;if($('qi_mode').value=='Select Master Item'){let m=S.items.find(i=>i.id==$('qi_master').value);it={custom:false,name:m.name,cat:m.cat,desc:m.desc,unit:m.unit,qty:+$('qi_qty').value||1,cost:m.cost,price:+$('qi_price').value||0,area,section,pricingType:ptype}}else{it={custom:true,name:$('qi_name').value,cat:$('qi_cat').value,desc:$('qi_desc').value,unit:$('qi_unit').value,qty:+$('qi_qty').value||1,cost:+$('qi_cost').value||0,price:+$('qi_price').value||0,area,section,pricingType:ptype};if($('qi_save').value=='Yes')S.items.push({id:uid('I'),name:it.name,cat:it.cat,unit:it.unit,cost:it.cost,desc:it.desc})}q.items.push(it);closeModal();show('quotation')}
function sendQ(){let q=S.quotes.find(x=>x.id==qDetail),miss=missingQuote(q);if(miss.length){toast('Complete required quotation data before send');return}if(!q.items.every(qvalid)){toast('Check Amount item price range before send');return}q.status='Sent';q.lastSent=today();q.versions.push({v:'v'+(q.versions.length+1),date:today(),template:q.template,total:qgrand(q),by:user().name});toast('Version saved. Last sent date updated for follow-up automation.');show('quotation')}
function scopeRows(q){let g={};q.items.forEach(i=>{let a=i.area||'Unassigned Area',s=i.section||'General Works';g[a]=g[a]||{};g[a][s]=g[a][s]||[];g[a][s].push(i)});return Object.entries(g).map(([a,ss])=>`<div class="previewPink">${esc(a)}</div>${Object.entries(ss).map(([s,its])=>`<b>${esc(s)}</b><table><tr><th>Scope of Works</th><th>Amount</th></tr>${its.map(i=>`<tr><td><b>${esc(i.name)}</b><br><span class="small">${esc(i.desc||'')}</span></td><td>${itemCounts(i)?money(i.qty*i.price):esc(i.pricingType)}</td></tr>`).join('')}</table>`).join('')}`).join('')}
function quotePreviewHtml(q){let c=co(q.co),m=q.clientMeta;return `<div class="previewHead"><div><img src="${c.logo}"><br><b>${esc(c.name)}</b></div><div class="small"><b>UEN:</b> ${esc(c.uen)}<br><b>GST:</b> ${esc(c.gst)}<br>${esc(c.addr)}<br>${esc(c.phone)}</div></div><table><tr><td>Name</td><td>${esc(m.name)}</td><td>Quotation No.</td><td>${esc(q.id)}</td></tr><tr><td>NRIC / UEN</td><td>${esc(m.nric||'-')}</td><td>Date</td><td>${today()}</td></tr><tr><td>Address</td><td>${esc(m.address)} ${esc(m.postal||'')}</td><td>Served By</td><td>${esc(uname(q.idUser))}</td></tr><tr><td>H/P</td><td>${esc(m.phone||'-')}</td><td>Email</td><td>${esc(m.email||'-')}</td></tr></table><p>${esc(c.docs.quoteIntro)}</p><h3>Scope of Works</h3>${scopeRows(q)}<table class="totals"><tr><td>Subtotal</td><td>${money(qtot(q))}</td></tr><tr><td>Discount</td><td>(${money(q.discount||0)})</td></tr><tr><td>GST ${c.gstRate||0}%</td><td>${money(qgst(q))}</td></tr><tr><td>Grand Total</td><td><b>${money(qgrand(q))}</b></td></tr></table><h3>Payment Schedule</h3><table>${paymentSchedule(q).map(x=>`<tr><td>${x.pct}%</td><td>${esc(x.label)}</td><td>${money(x.amount)}</td></tr>`).join('')}</table><p class="small">${esc(c.docs.terms)}</p>`}
function previewQuote(){let q=S.quotes.find(x=>x.id==qDetail);modal(`<div class="previewPaper">${quotePreviewHtml(q)}</div><br><button class="btn" onclick="closeModal()">Close</button> <button class="btn p" onclick="printDoc('Quotation ${q.id}',document.querySelector('.previewPaper').innerHTML)">Print / Save PDF</button>`)}
function generateLOA(){let q=S.quotes.find(x=>x.id==qDetail),p=S.projects.find(x=>x.id==q.p)||{},c=co(q.co);modal(`<h2>Letter of Appointment</h2><div class="warnbox">Flexible: this can be generated before or after quotation acceptance. Company wording comes from Superadmin template.</div><div class="form">${field('loa_fee','Design Fee / Appointment Fee','0','number')}${field('loa_budget','Estimated Project Budget',p.budget||qgrand(q),'number')}${field('loa_valid','Appointment Validity (months)','6','number')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="printLOA()">Preview / Print</button>`)}
function printLOA(){let q=S.quotes.find(x=>x.id==qDetail),p=S.projects.find(x=>x.id==q.p)||{},c=co(q.co),m=q.clientMeta;let body=`<div class="previewHead"><div><img src="${c.logo}"><br><b>${esc(c.name)}</b></div><div class="small">${esc(c.addr)}<br>UEN ${esc(c.uen)}</div></div><h2>Letter of Appointment</h2><p><b>I/We:</b> ${esc(m.name)}<br><b>NRIC/UEN:</b> ${esc(m.nric||'-')}<br><b>Premise:</b> ${esc(m.address)} ${esc(m.postal||'')}</p><p>${esc(c.docs.loa)}</p><p>Design / Appointment Fee: <b>${money(+$('loa_fee').value||0)}</b><br>Estimated Project Budget: <b>${money(+$('loa_budget').value||0)}</b><br>Validity: ${esc($('loa_valid').value)} months</p><br><br>Interior Designer Signature: ____________________ &nbsp;&nbsp; Client Signature: ____________________`;modal(`<div class="previewPaper">${body}</div><br><button class="btn" onclick="closeModal()">Close</button> <button class="btn p" onclick="printDoc('Letter of Appointment',document.querySelector('.previewPaper').innerHTML)">Print / Save PDF</button>`)}

P.projects=()=>pDetail?projDetail():head('Project Costing Overview','Filter first, then open detail. VO and DO are inside Project Costing.','Project Costing','<button class="btn p" onclick="newCase()">+ Create Case</button>')+fb('projects')+`<div class="card"><h3>Project List</h3>${projectTable(base(S.projects.filter(canP),p=>({...p,date:p.start,worker:p.idUser,status:p.status})))}</div>`;function projDetail(){let p=S.projects.find(x=>x.id==pDetail),cs=S.costs.filter(c=>c.p==p.id);if(!canP(p)){pDetail='';return '<div class="card">No access.</div>'}return head(p.name,'Real Cost / VO / DO / Manpower under one project.','Project Detail','<button class="btn" onclick="pDetail=\'\';show(\'projects\')">← Overview</button><button class="btn p" onclick="addCost()">+ Add Cost</button>')+`<div class="card"><b>${co(p.co).name}</b> | ${p.client} | ${pill(p.status)}<div class="tabs">${['cost','vo','do','manpower'].map(x=>`<button class="${sub==x?'active':''}" onclick="sub='${x}';show('projects')">${x.toUpperCase()}</button>`).join('')}</div>${sub=='cost'?costHtml(cs):sub=='vo'?voHtml(p):sub=='do'?doHtml(p):manHtml()}</div>`}function costHtml(cs){return `<div class="grid four"><div class="card"><div class="small">Budget</div><div class="money">${money(cs.reduce((a,c)=>a+c.budget,0))}</div></div><div class="card"><div class="small">Actual</div><div class="money">${money(cs.reduce((a,c)=>a+c.actual,0))}</div></div><div class="card"><div class="small">Committed</div><div class="money">${money(cs.reduce((a,c)=>a+c.committed,0))}</div></div><div class="card"><div class="small">Entries</div><div class="money">${cs.length}</div></div></div><br><table><tr><th>Category</th><th>Description</th><th>Supplier</th><th>Budget</th><th>Actual</th><th>Status</th><th></th></tr>${cs.map(c=>`<tr><td>${c.cat}</td><td>${c.desc}</td><td>${c.supplier}<br><span class="small">${c.invoice}</span></td><td>${money(c.budget)}</td><td>${money(c.actual)}</td><td>${pill(c.status)}</td><td><span class="link" onclick="c.status='Approved by ID';show('projects')">Approve</span></td></tr>`).join('')}</table>`}function voHtml(p){let vs=S.vos.filter(v=>v.p==p.id);return `<button class="btn p" onclick="addVO()">+ Add VO</button><br><br><table><tr><th>VO</th><th>Reason</th><th>Date</th><th>Additional</th><th>Cancellation</th><th>Net Variation</th><th>Status</th><th>Action</th></tr>${vs.map(v=>`<tr><td>${v.id}</td><td>${esc(v.reason)}</td><td>${v.date}</td><td>${money(voAdditional(v))}</td><td>${money(voCancel(v))}</td><td>${money(voNet(v))}</td><td>${pill(v.status)}</td><td><button class="btn s" onclick="openVO('${v.id}')">Open</button> <span class="link" onclick="v.status='Approved';show('projects')">Approve</span></td></tr>`).join('')||'<tr><td colspan="8">No VO</td></tr>'}</table>`}
function voAdditional(v){return v.items.filter(i=>(i.type||'Additional')=='Additional'&&itemCounts(i)).reduce((a,i)=>a+i.qty*i.price,0)}
function voCancel(v){return v.items.filter(i=>i.type=='Cancellation'&&itemCounts(i)).reduce((a,i)=>a+i.qty*i.price,0)}
function voNet(v){return voAdditional(v)-voCancel(v)}
function originalContract(p){let q=S.quotes.find(q=>q.p==p.id);return q?qgrand(q):0}
function addVO(){let p=S.projects.find(x=>x.id==pDetail);modal(`<h2>Create Variation Order</h2><div class="form">${field('av_reason','Reason','Client requested change')}${field('av_type','First Item Type','Additional|Cancellation','select')}${field('av_area','Area / Location','Kitchen 1')}${field('av_section','Work Section','Carpentry Works')}${field('av_name','Item Name','Additional cabinet')}${field('av_desc','Description','Client requested additional work','textarea','','full')}${field('av_qty','Qty','1','number')}${field('av_unit','Unit','Lot')}${field('av_cost','Internal Cost','0','number')}${field('av_price','Selling / Cancellation Amount','500','number')}${field('av_pt','Pricing Type','Amount|Inclusive|Complimentary|F.O.C|Optional','select')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveVO()">Create VO</button>`)}
function saveVO(){let p=S.projects.find(x=>x.id==pDetail),v={id:docNo('V',p.co),p:p.id,co:p.co,reason:$('av_reason').value,date:today(),status:'Pending',items:[{type:$('av_type').value,area:$('av_area').value,section:$('av_section').value,name:$('av_name').value,desc:$('av_desc').value,qty:+$('av_qty').value||1,unit:$('av_unit').value,cost:+$('av_cost').value||0,price:+$('av_price').value||0,pricingType:$('av_pt').value}]};S.vos.push(v);closeModal();toast('VO created and linked to original contract');show('projects')}
function openVO(id){let v=S.vos.find(x=>x.id==id),p=S.projects.find(x=>x.id==v.p),c=co(v.co);modal(`<h2>${v.id} - Variation Order</h2><div class="grid four"><div class="card"><div class="small">Original Contract</div><div class="money">${money(originalContract(p))}</div></div><div class="card"><div class="small">Additional</div><div class="money">${money(voAdditional(v))}</div></div><div class="card"><div class="small">Cancellation</div><div class="money">${money(voCancel(v))}</div></div><div class="card"><div class="small">New Contract</div><div class="money">${money(originalContract(p)+voNet(v)*(1+(c.gstRate||0)/100))}</div></div></div><br><table><tr><th>Type</th><th>Area / Section</th><th>Item / Description</th><th>Qty</th><th>Amount</th></tr>${v.items.map(i=>`<tr><td>${pill(i.type||'Additional')}</td><td>${esc(i.area)}<br>${esc(i.section)}</td><td><b>${esc(i.name)}</b><br><span class="small">${esc(i.desc)}</span></td><td>${i.qty} ${esc(i.unit)}</td><td>${qdisplay(i)}</td></tr>`).join('')}</table><br><button class="btn" onclick="closeModal()">Close</button> <button class="btn" onclick="addVOItem('${id}')">+ Add Item</button> <button class="btn p" onclick="printVO('${id}')">Preview / Print VO</button>`)}
function addVOItem(id){modal(`<h2>Add VO Item</h2><div class="form">${field('vi_type','Type','Additional|Cancellation','select')}${field('vi_area','Area / Location','Kitchen 1')}${field('vi_section','Work Section','Carpentry Works')}${field('vi_name','Item','New Variation Item')}${field('vi_desc','Description','','textarea','','full')}${field('vi_qty','Qty','1','number')}${field('vi_unit','Unit','Lot')}${field('vi_cost','Internal Cost','0','number')}${field('vi_price','Amount','0','number')}${field('vi_pt','Pricing Type','Amount|Inclusive|Complimentary|F.O.C|Optional','select')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveVOItem('${id}')">Add</button>`)}
function saveVOItem(id){let v=S.vos.find(x=>x.id==id);v.items.push({type:$('vi_type').value,area:$('vi_area').value,section:$('vi_section').value,name:$('vi_name').value,desc:$('vi_desc').value,qty:+$('vi_qty').value||1,unit:$('vi_unit').value,cost:+$('vi_cost').value||0,price:+$('vi_price').value||0,pricingType:$('vi_pt').value});closeModal();openVO(id)}
function printVO(id){let v=S.vos.find(x=>x.id==id),p=S.projects.find(x=>x.id==v.p),q=S.quotes.find(x=>x.p==p.id),c=co(v.co),gst=voNet(v)*(c.gstRate||0)/100,newTotal=originalContract(p)+voNet(v)+gst;let body=`<div class="previewHead"><div><img src="${c.logo}"><br><b>${esc(c.name)}</b></div><div class="small">${esc(c.addr)}<br>UEN ${esc(c.uen)}<br>VO No. ${esc(v.id)}</div></div><h2>Variation Order</h2><p>${esc(c.docs.vo)}</p><p>Client: ${esc(p.client)}<br>Project: ${esc(p.site)}<br>Existing Contract: ${esc(q?.id||'-')}</p><table><tr><th>Type</th><th>Area / Scope</th><th>Description</th><th>Amount</th></tr>${v.items.map(i=>`<tr><td>${esc(i.type)}</td><td>${esc(i.area)} / ${esc(i.section)}</td><td><b>${esc(i.name)}</b><br>${esc(i.desc)}</td><td>${qdisplay(i)}</td></tr>`).join('')}</table><table class="totals"><tr><td>Original Contract</td><td>${money(originalContract(p))}</td></tr><tr><td>Additional</td><td>${money(voAdditional(v))}</td></tr><tr><td>Cancellation</td><td>(${money(voCancel(v))})</td></tr><tr><td>Variation GST</td><td>${money(gst)}</td></tr><tr><td>New Grand Total</td><td><b>${money(newTotal)}</b></td></tr></table>`;modal(`<div class="previewPaper">${body}</div><br><button class="btn" onclick="closeModal()">Close</button> <button class="btn p" onclick="printDoc('${v.id}',document.querySelector('.previewPaper').innerHTML)">Print / Save PDF</button>`)}
function doHtml(p){let d=S.dos.find(d=>d.p==p.id);if(!d)return `<button class="btn p" onclick="S.dos.push({id:docNo('D','${p.co}'),p:'${p.id}',co:'${p.co}',receiver:'',signed:false,status:'Draft',date:today(),items:[{name:'Main works completed',done:false},{name:'Site cleaned',done:false},{name:'Keys returned / handed over',done:false}]});show('projects')">Create DO / Handover</button>`;return `<div class="grid two"><div><table><tr><th>Done</th><th>Handover Checklist</th></tr>${d.items.map((i,n)=>`<tr><td><input type="checkbox" ${i.done?'checked':''} onchange="d.items[${n}].done=this.checked;save()"></td><td>${esc(i.name)}</td></tr>`).join('')}</table></div><div class="soft"><b>${d.id}</b><br>Status: ${pill(d.status)}<br><br>${field('do_recv','Received / Acknowledged By',d.receiver)}<button class="btn s" onclick="d.receiver=$('do_recv').value;d.status='Completed';d.signed=true;save();show('projects')">Record Handover</button> <button class="btn p s" onclick="handoverForm('${p.id}')">Handover House Key Form</button></div></div>`}
function handoverForm(pid){let p=S.projects.find(x=>x.id==pid),d=S.dos.find(x=>x.p==pid),c=co(p.co);modal(`<h2>Handover House Key Form</h2><div class="form">${field('hf_customer','Customer',p.client)}${field('hf_email','Email',p.email||'')}${field('hf_phone','Contact No.',p.phone||'')}${field('hf_addr','Address',p.site,'textarea','','full')}${field('hf_designer','Designer',uname(p.idUser))}${field('hf_date','Handover Date',d?.date||today(),'date')}${field('hf_manager','Manager',uname(p.pm))}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="printHandover('${pid}')">Preview / Print</button>`)}
function printHandover(pid){let p=S.projects.find(x=>x.id==pid),c=co(p.co);let body=`<div class="previewHead"><div><img src="${c.logo}"><br><b>${esc(c.name)}</b></div><div class="small">${esc(c.addr)}<br>UEN ${esc(c.uen)}</div></div><h2>Handover House Key Form</h2><p>${esc(c.docs.handover)}</p><p>Customer: ${esc($('hf_customer').value)}<br>Email: ${esc($('hf_email').value)}<br>Contact No.: ${esc($('hf_phone').value)}<br>Address: ${esc($('hf_addr').value)}<br>Designer: ${esc($('hf_designer').value)}<br>Handover Date: ${esc($('hf_date').value)}</p><br><br>Client Acknowledgement / Date: ____________________<br><br>Consultant Signature / Date: ____________________<br><br>Manager Signature / Date: ____________________`;modal(`<div class="previewPaper">${body}</div><br><button class="btn" onclick="closeModal()">Close</button> <button class="btn p" onclick="printDoc('Handover House Key Form',document.querySelector('.previewPaper').innerHTML)">Print / Save PDF</button>`)}

function manHtml(){return `<div class="grid three"><div class="card">Carpenter<br><div class="money">${money(S.settings.rates.carpenter)}/hr</div></div><div class="card">Installer<br><div class="money">${money(S.settings.rates.installer)}/hr</div></div><div class="card">Technician<br><div class="money">${money(S.settings.rates.technician)}/hr</div></div></div><p class="small">For testing, key manpower as cost category Manpower.</p>`}function addCost(){modal(`<h2>Add Cost</h2><div class="form">${field('ac_cat','Category','Materials|Supplier|Manpower|Transport|Misc','select')}${field('ac_desc','Description','New cost')}${field('ac_sup','Supplier','Internal Team')}${field('ac_budget','Budget','0','number')}${field('ac_actual','Actual','0','number')}${field('ac_comm','Committed','0','number')}${field('ac_inv','Invoice No.','INV-TEST')}</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="S.costs.push({id:uid('C'),p:pDetail,cat:$('ac_cat').value,desc:$('ac_desc').value,supplier:$('ac_sup').value,invoice:$('ac_inv').value,budget:+$('ac_budget').value||0,actual:+$('ac_actual').value||0,committed:+$('ac_comm').value||0,status:'Pending ID Approval'});closeModal();show('projects')">Save</button>`)}function addVO(){modal(`<h2>Add VO</h2><div class="form">${field('vo_r','Reason','Client requested additional work')}${field('vo_i','Item','Additional cabinet')}${field('vo_q','Qty','1','number')}${field('vo_p','Unit Price','500','number')}</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="let p=S.projects.find(x=>x.id==pDetail);S.vos.push({id:'VO-2026-'+String(S.vos.length+1).padStart(4,'0'),p:p.id,co:p.co,reason:$('vo_r').value,date:today(),status:'Pending',items:[{name:$('vo_i').value,qty:+$('vo_q').value||1,price:+$('vo_p').value||0}]});closeModal();sub='vo';show('projects')">Save</button>`)}
P.invoices=()=>{let pids=S.projects.filter(canP).map(p=>p.id),rows=S.invoices.filter(i=>pids.includes(i.p));rows=base(rows,i=>({...i,date:i.created,worker:i.idUser,status:invStatus(i)}));if(invSub!='All')rows=rows.filter(i=>invStatus(i)==invSub);return head('Invoice Overview','Filter by company, project, worker, date and payment status. Create staged invoices directly from accepted quotation/payment schedule.','Invoices','<button class="btn p" onclick="newStageInvoice()">+ Create Staged Invoice</button><button class="btn" onclick="recordPay()">Record Payment</button>')+`<div class="mini">${['All','Unpaid','Partially Paid','Overdue','Paid'].map(x=>`<button class="${invSub==x?'active':''}" onclick="invSub='${x}';show('invoices')">${x}</button>`).join('')}</div>`+fb('invoices')+`<div class="card"><h3>Invoices / Official Receipts</h3>${invTable(rows)}</div>`};
function invTable(rows){if(!rows.length)return '<p class="small">No invoice.</p>';return `<div class="wrap"><table><tr><th>Invoice</th><th>Company</th><th>Project / Stage</th><th>Amount</th><th>Received</th><th>Outstanding</th><th>Due</th><th>Payment %</th><th>Status</th><th>Document</th></tr>${rows.map(i=>{let p=paid(i),pct=i.amount?p/i.amount*100:0;return `<tr><td>${i.id}</td><td>${co(i.co).short}</td><td>${esc(i.project)}<br><span class="small">${esc(i.stage||'Manual Invoice')} / ${esc(i.client)}</span></td><td>${money(i.amount)}</td><td>${money(p)}</td><td>${money(i.amount-p)}</td><td>${i.due}<br><span class="${invStatus(i)=='Overdue'?'danger':'small'}">${invStatus(i)=='Overdue'?days(i.due)+' days overdue':'-'}</span></td><td><b class="${pct<S.settings.payPct?'danger':'link'}">${pct.toFixed(1)}%</b></td><td>${pill(invStatus(i))}</td><td><button class="btn s" onclick="printInv('${i.id}')">Invoice / Receipt</button></td></tr>`}).join('')}</table></div>`}
function newStageInvoice(){let qs=S.quotes.filter(q=>canP(S.projects.find(p=>p.id==q.p))&&q.status!='Draft');if(!qs.length){toast('Send/accept a quotation first');return}let q=qs[0],sch=paymentSchedule(q);modal(`<h2>Create Staged Invoice</h2><div class="form">${field('ni_q','Quotation',q.id,'select',qs.map(x=>x.id).join('|'))}${field('ni_stage','Payment Stage','0','select','0|1|2|3')}${field('ni_due','Due Date',today(),'date')}</div><div class="warnbox">Stage 0 = down payment; 1 = commencement; 2 = carpentry measurement; 3 = completion/handover. Amount is calculated automatically from the company payment template.</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveStageInvoice()">Create Invoice</button>`)}
function saveStageInvoice(){let q=S.quotes.find(x=>x.id==$('ni_q').value),p=S.projects.find(x=>x.id==q.p),idx=+$('ni_stage').value||0,st=paymentSchedule(q)[idx];let i={id:docNo('I',q.co),p:q.p,co:q.co,client:q.client,project:q.project,idUser:q.idUser,amount:st.amount,due:$('ni_due').value,created:today(),status:'Unpaid',stage:st.label,stagePct:st.pct,quoteId:q.id,payments:[]};S.invoices.push(i);closeModal();toast('Staged invoice created from quotation');show('invoices')}
function recordPay(){let inv=S.invoices.filter(i=>canP(S.projects.find(p=>p.id==i.p)));modal(`<h2>Record Payment</h2><div class="form">${field('rp_inv','Invoice',inv[0]?.id||'','select',inv.map(i=>i.id).join('|'))}${field('rp_amt','Amount','1000','number')}${field('rp_method','Method','Bank Transfer|PayNow|Credit Card|Cash|Cheque','select')}${field('rp_ref','Reference','RCPT-'+Math.floor(Math.random()*9999))}</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="let i=S.invoices.find(x=>x.id==$('rp_inv').value);i.payments.push({date:today(),method:$('rp_method').value,amount:+$('rp_amt').value||0,ref:$('rp_ref').value});i.status=invStatus(i);closeModal();show('invoices')">Save</button>`)}
function printInv(id){let i=S.invoices.find(x=>x.id==id)||S.invoices[0],p=S.projects.find(x=>x.id==i.p)||{},c=co(i.co),rec=paid(i),due=Math.max(i.amount-rec,0),base=i.amount/(1+(c.gstRate||0)/100),tax=i.amount-base;let body=`<div class="previewHead"><div><img src="${c.logo}"><br><b>${esc(c.name)}</b></div><div class="small">${esc(c.addr)}<br>UEN ${esc(c.uen)}<br>${esc(c.gst)}</div></div><h2>INV / OFFICIAL RECEIPT</h2><p>${esc(c.docs.invoice)}</p><table><tr><td>Customer</td><td>${esc(i.client)}</td><td>Invoice Date</td><td>${esc(i.created)}</td></tr><tr><td>Project Address</td><td>${esc(p.site||'')}</td><td>Invoice Number</td><td>${esc(i.id)}</td></tr><tr><td>Reference</td><td>${esc(uname(i.idUser))}</td><td>Due Date</td><td>${esc(i.due)}</td></tr></table><table><tr><th>Description</th><th>Quantity</th><th>Unit Price</th><th>Tax</th><th>Amount SGD</th></tr><tr><td>${esc((i.stagePct||'')+'% '+(i.stage||'Payment'))} for ${esc(p.site||i.project)}</td><td>1.00</td><td>${money(base)}</td><td>${c.gstRate||0}%</td><td>${money(base)}</td></tr></table><table class="totals"><tr><td>Subtotal</td><td>${money(base)}</td></tr><tr><td>GST ${c.gstRate||0}%</td><td>${money(tax)}</td></tr><tr><td>Total SGD</td><td><b>${money(i.amount)}</b></td></tr><tr><td>Less Amount Paid</td><td>${money(rec)}</td></tr><tr><td>Amount Due SGD</td><td><b>${money(due)}</b></td></tr></table><p class="small">${esc(c.bank)}<br>PayNow UEN: ${esc(c.paynow)}</p>`;modal(`<div class="previewPaper">${body}</div><br><button class="btn" onclick="closeModal()">Close</button> <button class="btn p" onclick="printDoc('${i.id}',document.querySelector('.previewPaper').innerHTML)">Print / Save PDF</button>`)}

P.po=()=>{let pids=S.projects.filter(canP).map(p=>p.id),rows=S.sup.filter(s=>pids.includes(s.p));rows=base(rows,s=>({...s,date:s.date,status:supStatus(s)}));if(poSub!='All')rows=rows.filter(s=>supStatus(s)==poSub);return head('PO / Supplier Invoice Aging','Supplier invoice attachment, verification, approval for payment, payment status and duplicate warnings.','PO / Supplier','<button class="btn p" onclick="addSup()">+ Add Supplier Invoice</button><button class="btn r" onclick="printPO()">Generate PO</button>')+`<div class="mini">${['All','Pending Verification','Approved','Partial','Paid','Duplicate Warning','Overdue'].map(x=>`<button class="${poSub==x?'active':''}" onclick="poSub='${x}';show('po')">${x}</button>`).join('')}</div>`+fb('po')+`<div class="grid two"><div class="card"><h3>Purchase Orders</h3>${poTable()}</div><div class="card"><h3>Supplier Invoice Aging</h3>${supTable(rows,false)}</div></div>`};function supStatus(s){if(isDup(s))return 'Duplicate Warning';if(s.pay=='Paid')return 'Paid';if(days(s.due)>0&&s.pay!='Paid')return 'Overdue';if(s.approve=='Pending Verification')return 'Pending Verification';if(s.pay=='Partial')return 'Partial';return s.approve}function poTable(){return `<table><tr><th>PO</th><th>Supplier</th><th>Project</th><th>Amount</th><th>Status</th></tr>${S.pos.filter(po=>canP(S.projects.find(p=>p.id==po.p))).map(po=>`<tr><td>${po.id}</td><td>${po.supplier}</td><td>${(S.projects.find(p=>p.id==po.p)||{}).name}</td><td>${money(po.items.reduce((a,i)=>a+i.qty*i.price,0))}</td><td>${pill(po.status)}</td></tr>`).join('')}</table>`}function supTable(rows,compact){if(!rows.length)return '<p class="small">No supplier invoice.</p>';return `<div class="${compact?'':'wrap'}"><table><tr><th>Supplier</th><th>Invoice</th><th>Project</th><th>Amount</th><th>Unpaid</th><th>Approval</th>${compact?'':'<th>Payment</th><th>Attachment</th><th>Duplicate</th><th>Action</th>'}</tr>${rows.map(s=>`<tr><td>${s.supplier}</td><td>${s.invoice}</td><td>${(S.projects.find(p=>p.id==s.p)||{}).name}</td><td>${money(s.amount)}</td><td>${money(s.amount-s.paid)}</td><td>${pill(s.approve)}<br><span class="small">${s.verifyBy?uname(s.verifyBy):'Not verified'}</span></td>${compact?'':`<td>${pill(s.pay)}</td><td>${s.file?`<span class="link" onclick="modal('<h2>Attachment</h2><p>${s.file}</p><div class=warnbox>Frontend test stores file name only. Real upload needs backend storage later.</div><button class=btn onclick=closeModal()>Close</button>')">${s.file}</span>`:'-'}</td><td>${isDup(s)?'<span class="danger">Duplicate</span>':'-'}</td><td><button class="btn s" onclick="s.approve='Approved';s.verifyBy=user().id;show('po')">Verify</button> <button class="btn s g" onclick="if(s.approve!='Approved'){toast('Need approval first')}else{s.paid=s.amount;s.pay='Paid';show('po')}">Pay</button></td>`}</tr>`).join('')}</table></div>`}function addSup(){let ps=S.projects.filter(canP).filter(p=>p.status!='Closed');modal(`<h2>Add Supplier Invoice</h2><div class="warnbox">Attachment is local file name only for frontend test.</div><div class="form">${field('as_sup','Supplier','Niro Granite Pte Ltd')}${field('as_inv','Invoice No.','INV-2026-0187')}${field('as_p','Project',ps[0]?.id||'','select',ps.map(p=>p.id).join('|'))}${field('as_amt','Amount','1000','number')}${field('as_due','Due Date',today(),'date')}<div class="field full"><label>Attachment</label><input id="as_file" type="file" accept=".pdf,image/*"></div></div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveSup()">Save</button>`)}function saveSup(){let p=S.projects.find(x=>x.id==$('as_p').value),f=$('as_file').files[0];let s={id:'SIN-2026-'+String(S.sup.length+1).padStart(4,'0'),co:p.co,supplier:$('as_sup').value,invoice:$('as_inv').value,p:p.id,po:'',amount:+$('as_amt').value||0,paid:0,date:today(),due:$('as_due').value,approve:'Pending Verification',pay:'Unpaid',verifyBy:'',file:f?f.name:''};S.sup.push(s);closeModal();toast(isDup(s)?'Saved with duplicate warning':'Supplier invoice saved');show('po')}function printPO(){let p=S.pos[0];printDoc('PO '+p.id,`<p>${co(p.co).name}<br>Supplier: ${p.supplier}</p>`)}
P.profit=()=>{let pids=S.projects.filter(canP).map(p=>p.id),rows=S.comm.filter(c=>pids.includes(c.p));if(user().role!='Superadmin'&&!has('View All Commission'))rows=rows.filter(c=>c.worker==user().id&&c.status=='Approved');rows=base(rows,c=>({...c,date:c.date,status:c.paid?'Paid':c.status,worker:c.worker}));let sales=S.quotes.filter(q=>pids.includes(q.p)).reduce((a,q)=>a+qtot(q),0),cost=S.costs.filter(c=>pids.includes(c.p)).reduce((a,c)=>a+c.actual,0);return head('Profit & Commission','Filter by worker. Staff see own commission only after Superadmin approval.','Reports','<button class="btn p" onclick="approveAllComm()">Approve Pending</button>')+fb('profit')+`<div class="grid four"><div class="card"><div class="small">Sales</div><div class="money">${money0(sales)}</div></div><div class="card"><div class="small">Cost</div><div class="money">${money0(cost)}</div></div><div class="card"><div class="small">Profit</div><div class="money">${money0(sales-cost)}</div></div><div class="card"><div class="small">Visible Commission</div><div class="money">${money0(rows.reduce((a,c)=>a+c.amount,0))}</div></div></div><br><div class="card"><h3>Commission by Worker</h3><table><tr><th>Worker</th><th>Project</th><th>Company</th><th>Amount</th><th>Status</th><th>Paid</th><th>Action</th></tr>${rows.map(c=>`<tr><td>${uname(c.worker)}</td><td>${c.project}</td><td>${co(c.co).short}</td><td>${money(c.amount)}</td><td>${pill(c.status)}</td><td>${c.paid?pill('Paid'):pill('Unpaid')}</td><td>${user().role=='Superadmin'?`<button class="btn s" onclick="c.status='Approved';show('profit')">Approve</button> <button class="btn s g" onclick="if(c.status!='Approved'){toast('Approve first')}else{c.paid=true;show('profit')}">Mark Paid</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="7">No visible commission. Staff only see approved commission.</td></tr>'}</table></div>`};function approveAllComm(){if(user().role!='Superadmin')return toast('Only Superadmin');S.comm.filter(c=>c.status=='Pending Superadmin Approval').forEach(c=>c.status='Approved');show('profit')}
P.master=()=>head('Master Data','Pricing rules, quotation templates, payment trigger, follow-up day, manpower rates and reusable scope wording.','Master Data','<button class="btn p" onclick="saveSet()">Save Settings</button>')+`<div class="grid three"><div class="card"><h3>Rules</h3>${field('st_n','Normal Markup %',S.settings.normal,'number')}${field('st_m','Max Markup %',S.settings.max,'number')}${field('st_p','Payment Trigger %',S.settings.payPct,'number')}${field('st_f','Quotation Follow-up Days',S.settings.followDays,'number')}</div><div class="card"><h3>3 Quotation Templates</h3>${S.settings.templates.map((t,i)=>field('tpl'+i,'Template '+(i+1),t)).join('')}</div><div class="card"><h3>Manpower Rates</h3>${field('rt_c','Carpenter / Hour',S.settings.rates.carpenter,'number')}${field('rt_i','Installer / Hour',S.settings.rates.installer,'number')}${field('rt_t','Technician / Hour',S.settings.rates.technician,'number')}</div></div><br><div class="grid two"><div class="card"><h3>Scope / Work Section Library</h3>${field('scope_lib','Common Work Sections',S.settings.scopeSections.join('\n'),'textarea','','full')}<p class="small">One section per line. ID can still type a completely new Area / Work Section in the quotation.</p></div><div class="card"><h3>Company Document Templates</h3><p>Quotation/T&C, LOA, Invoice, VO, Handover and payment schedule are edited per company in Company Master.</p><button class="btn" onclick="show('companies')">Open Company Master</button></div></div><br><div class="card"><h3>Item Master</h3><table><tr><th>Item</th><th>Category</th><th>Description</th><th>Cost</th><th>Min</th><th>Max</th></tr>${S.items.map(i=>`<tr><td>${i.name}</td><td>${i.cat}</td><td>${i.desc}</td><td>${money(i.cost)}</td><td>${money(i.cost*(1+S.settings.normal/100))}</td><td>${money(i.cost*(1+S.settings.max/100))}</td></tr>`).join('')}</table></div>`;
function saveSet(){S.settings.normal=+$('st_n').value||30;S.settings.max=+$('st_m').value||40;S.settings.payPct=+$('st_p').value||30;S.settings.followDays=+$('st_f').value||10;S.settings.templates=S.settings.templates.map((_,i)=>$('tpl'+i).value);S.settings.rates={carpenter:+$('rt_c').value||0,installer:+$('rt_i').value||0,technician:+$('rt_t').value||0};S.settings.scopeSections=$('scope_lib').value.split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean);toast('Master settings saved');show('master')}

P.users=()=>head('Users & Flexible Access','Superadmin can edit staff company access, project visibility and permission matrix.','Users','<button class="btn p" onclick="editUser()">+ Add User</button>')+`<div class="warnbox"><b>Confirmed:</b> normal worker can only see quotations/cases/projects created by or assigned to them. Closed case/project hidden unless Superadmin allows. Commission visible only after Superadmin approval.</div><div class="card"><h3>Staff Access Matrix</h3><div class="wrap"><table><tr><th>Name</th><th>Role</th><th>Company</th><th>Project Visibility</th><th>Closed</th><th>Commission</th><th>Action</th></tr>${S.users.map(u=>`<tr><td><b>${u.name}</b><br><span class="small">${u.email}</span></td><td>${u.role}</td><td>${u.co.includes('ALL')?'All':u.co.map(x=>co(x).short).join(', ')}</td><td>${u.vis}</td><td>${u.closed?pill('Allowed'):pill('Blocked')}</td><td>${u.commAll?'All':'Approved own only'}</td><td><button class="btn s" onclick="editUser('${u.id}')">Edit</button></td></tr>`).join('')}</table></div></div><br><div class="card"><h3>Audit Log</h3><table>${S.audit.map(a=>`<tr><td>${a.date}</td><td>${a.by}</td><td>${a.action}</td><td>${a.detail}</td></tr>`).join('')}</table></div>`;function editUser(id=''){let u=S.users.find(x=>x.id==id)||{id:'',name:'',email:'',role:'ID / Salesperson',co:['CO1'],vis:'Own Assigned Open Only',closed:false,commAll:false,perms:['Create Case','View Own Open Cases','Create Quotation','Edit Quotation','View Own Approved Commission']};modal(`<h2>${id?'Edit':'Add'} User</h2><div class="form">${field('eu_name','Name',u.name)}${field('eu_email','Email',u.email)}${field('eu_role','Role',u.role,'select','Superadmin|Admin|ID / Salesperson|Project Manager|Accounts|Viewer')}${field('eu_vis','Project Visibility',u.vis,'select','Own Assigned Open Only|Assigned Open Projects|All Open Projects|All Projects')}${field('eu_closed','Can View Closed?',u.closed?'Yes':'No','select','No|Yes')}${field('eu_comm','Commission View',u.commAll?'All':'Approved own only','select','Approved own only|All')}<div class="field full"><label>Company Access</label><div class="checkgrid"><label class="check"><input id="eu_all" type="checkbox" ${u.co.includes('ALL')?'checked':''}> All Companies</label>${S.companies.map(c=>`<label class="check"><input class="eu_co" type="checkbox" value="${c.id}" ${u.co.includes(c.id)?'checked':''}> ${c.short} ${c.name}</label>`).join('')}</div></div><div class="field full"><label>Permissions</label><div class="checkgrid">${PERMS.map(p=>`<label class="check"><input class="eu_perm" type="checkbox" value="${p}" ${u.perms.includes(p)?'checked':''}> ${p}</label>`).join('')}</div></div></div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveUser('${id}')">Save</button>`)}function saveUser(id){let data={id:id||uid('U'),name:$('eu_name').value,email:$('eu_email').value,role:$('eu_role').value,co:$('eu_all').checked?['ALL']:[...document.querySelectorAll('.eu_co:checked')].map(x=>x.value),vis:$('eu_vis').value,closed:$('eu_closed').value=='Yes',commAll:$('eu_comm').value=='All',perms:[...document.querySelectorAll('.eu_perm:checked')].map(x=>x.value)};if(id)Object.assign(S.users.find(x=>x.id==id),data);else S.users.push(data);S.audit.push({date:new Date().toLocaleString(),by:user().name,action:id?'Updated user access':'Created user',detail:data.name+' / '+data.vis});closeModal();show('users')}
$('modal').onclick=e=>{if(e.target.id=='modal')closeModal()};show('dashboard');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
