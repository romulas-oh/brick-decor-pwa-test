<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brick & Decor PWA v0.3.1 Usable Test</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --brand:#ff5b5f;--brand-dark:#dd4448;--brand-soft:#fff0f0;--bg:#f7f8fb;--card:#fff;--line:#e7eaf0;
  --text:#202631;--muted:#727987;--green:#18a058;--orange:#f59e0b;--red:#e5484d;--blue:#3b82f6;--purple:#8b5cf6;
  --shadow:0 10px 28px rgba(16,24,40,.06);--radius:18px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:#fff;border-right:1px solid var(--line);padding:22px 18px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:10}
.main{margin-left:260px;width:calc(100% - 260px)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:40px;height:40px;border:2px solid var(--brand);border-radius:10px;position:relative}
.logo:before{content:"";position:absolute;left:7px;bottom:6px;width:22px;height:16px;border:2px solid var(--brand)}
.logo:after{content:"";position:absolute;left:10px;top:3px;width:16px;height:16px;border-left:2px solid var(--brand);border-top:2px solid var(--brand);transform:rotate(45deg);background:#fff}
.brand b{letter-spacing:.12em;font-size:18px}
.nav button{width:100%;border:0;background:transparent;padding:12px;border-radius:13px;text-align:left;font-weight:800;color:#3e4654;cursor:pointer;margin:2px 0;display:flex;gap:10px;align-items:center}
.nav button:hover,.nav button.active{background:var(--brand-soft);color:var(--brand)}
.promo{margin-top:22px;background:linear-gradient(135deg,var(--brand),#ff8375);border-radius:18px;color:#fff;padding:18px;box-shadow:var(--shadow)}
.promo p{font-size:12px;line-height:1.45;margin:8px 0 0;color:rgba(255,255,255,.9)}
.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.search{width:380px;border:1px solid var(--line);border-radius:14px;padding:12px 16px;outline:none}
.user{display:flex;align-items:center;gap:12px}.avatar{width:40px;height:40px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-weight:900}
.content{padding:26px;max-width:1540px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:7px}.sub{color:var(--muted);margin:4px 0 0}
h1{margin:0;font-size:28px}h3{margin:0 0 14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:850;cursor:pointer;color:var(--text)}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.red{border-color:#ffd3d5;color:var(--brand)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.small{padding:7px 10px;font-size:12px}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(6,1fr)}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.sidegrid{grid-template-columns:1fr 370px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.small{font-size:12px;color:var(--muted)}.money{font-size:23px;font-weight:950;margin:3px 0}.total{font-size:31px;color:var(--brand);font-weight:950}.up{color:var(--green);font-weight:850}.down{color:var(--red);font-weight:850}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{background:#fafbfc;color:#697286;font-size:12px}tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:850;white-space:nowrap}.greenp{background:#e9f8ef;color:var(--green)}.orangep{background:#fff7e6;color:#b77900}.redp{background:#fff1f1;color:var(--red)}.bluep{background:#eef5ff;color:var(--blue)}
.progress{height:9px;background:#f0f2f5;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#ff8a75)}.progress.greenbar span{background:linear-gradient(90deg,var(--green),#88d8a5)}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:850;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}.field textarea{min-height:92px}
.notice{background:var(--brand-soft);border:1px solid #ffd5d6;color:#8b3036;border-radius:14px;padding:13px;margin:16px 0}.ok{border-color:#a3e6b7!important;background:#fbfffc!important}.bad{border-color:#ffb4b6!important;background:#fff8f8!important}
.upload{min-height:96px;border:1px dashed #cbd1dc;border-radius:14px;display:grid;place-items:center;color:var(--muted);font-weight:800;text-align:center;background:#fbfcfe;overflow:hidden}.uploads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.thumb{height:88px;border-radius:12px;background:linear-gradient(135deg,#c7b6a3,#f1ece5);border:1px solid var(--line);background-size:cover;background-position:center}.video:after{content:"▶";display:grid;place-items:center;height:100%;background:rgba(0,0,0,.25);color:#fff;font-size:24px;border-radius:12px}
.tabs{display:flex;gap:10px;border-bottom:1px solid var(--line);margin:16px -18px 18px;padding:0 18px}.tabs span{padding:10px 4px;font-weight:850;color:#687083}.tabs .active{color:var(--brand);border-bottom:3px solid var(--brand)}
.donut{width:180px;height:180px;border-radius:50%;background:conic-gradient(var(--blue) 0 19%,var(--orange) 19% 50%,var(--brand) 50% 59%,#4b5563 59% 65%,#cbd5e1 65% 100%);position:relative;margin:auto}.donut:after{content:"32\A Total Projects";white-space:pre;position:absolute;inset:42px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:900;font-size:26px;line-height:1.1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:99;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:22px;box-shadow:0 20px 70px rgba(15,23,42,.25);padding:20px;width:min(760px,96vw);max-height:90vh;overflow:auto}.toast{position:fixed;bottom:22px;right:22px;background:#151b27;color:#fff;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);z-index:120;display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}.right{text-align:right}.danger{color:var(--red);cursor:pointer}.click{cursor:pointer;color:var(--brand);font-weight:850}
@media(max-width:1100px){.sidebar{position:static;width:100%}.main{margin-left:0;width:100%}.app{display:block}.kpis,.two,.three,.four,.sidegrid,.form{grid-template-columns:1fr}.search{width:100%}.topbar{height:auto;gap:12px;flex-wrap:wrap;padding:14px}.content{padding:14px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"><div class="modalbox"><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const $ = id => document.getElementById(id);
const money = n => '$' + Number(n || 0).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '$' + Number(n || 0).toLocaleString('en-SG',{maximumFractionDigits:0});
const uid = p => p + '-' + Math.random().toString(36).slice(2,8);
const now = () => new Date().toISOString().slice(0,10);
const toast = msg => { const t=$('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2200); };
const NAV=[['dashboard','🏠','Dashboard'],['clients','👥','Clients / Case'],['quotation','📄','Quotation'],['projects','🏗️','Project Cost'],['vo','🧾','VO'],['po','📦','PO'],['do','✅','DO / Handover'],['invoices','💳','Invoices & Payments'],['warranty','🛡️','Warranty & Media'],['profit','📊','Profit & Commission'],['master','⚙️','Master Data']];

const seed = {
  settings:{normalMarkup:30,maxMarkup:40,approvalAbove:40,laborWarranty:'12 Months',materialWarranty:'As per manufacturer',rates:{carpenter:80,installer:60,technician:55}},
  clients:[{id:'C-001',type:'Individual',name:'Jessica Tan',phone:'+65 9123 4567',email:'jessica.tan@email.com',address:'28A River Valley Road',notes:'Prefers light colour palette and soft-close fittings.'}],
  projects:[{id:'PRJ-001',name:'Condo Renovation - 28A',clientId:'C-001',client:'Jessica Tan',salesperson:'Alex Wong',type:'Condo Renovation',site:'28A River Valley Road #02-01',status:'In Progress',progress:55,warranty:'12 Months',start:'2025-05-12',target:'2025-06-30'}],
  items:[
    {id:'IT-001',desc:'Custom Kitchen Carpentry',cat:'Carpentry',unit:'Lot',cost:8000},
    {id:'IT-002',desc:'Quartz Kitchen Top',cat:'Surface',unit:'Lot',cost:3000},
    {id:'IT-003',desc:'Backsplash (Porcelain)',cat:'Tiles',unit:'Lot',cost:1600},
    {id:'IT-004',desc:'LED Strip Light Fitting',cat:'Electrical',unit:'Lot',cost:650}
  ],
  quotes:[{id:'QT-001',projectId:'PRJ-001',client:'Jessica Tan',project:'Condo Renovation - 28A',salesperson:'Alex Wong',status:'Draft',items:[
    {itemId:'IT-001',desc:'Custom Kitchen Carpentry',cat:'Carpentry',qty:1,unit:'Lot',cost:8000,price:10400},
    {itemId:'IT-002',desc:'Quartz Kitchen Top',cat:'Surface',qty:1,unit:'Lot',cost:3000,price:4200},
    {itemId:'IT-003',desc:'Backsplash (Porcelain)',cat:'Tiles',qty:1,unit:'Lot',cost:1600,price:2160},
    {itemId:'IT-004',desc:'LED Strip Light Fitting',cat:'Electrical',qty:1,unit:'Lot',cost:650,price:845}
  ]}],
  costs:[
    {id:'COST-1',projectId:'PRJ-001',cat:'Materials',desc:'Porcelain Tiles – Living Area',supplier:'Niro Granite Pte Ltd',ref:'INV-2025-0187',date:'2025-05-10',budget:2500,actual:2250,committed:0,status:'Paid'},
    {id:'COST-2',projectId:'PRJ-001',cat:'Materials',desc:'Kitchen Cabinets – Package',supplier:'Carpentry Works',ref:'INV-2025-0192',date:'2025-05-12',budget:4800,actual:2400,committed:2400,status:'Partial'},
    {id:'COST-3',projectId:'PRJ-001',cat:'Manpower',desc:'Carpentry Labour',supplier:'Internal Team',ref:'MP-2025-0007',date:'2025-05-08',budget:1600,actual:1120,committed:0,status:'Paid'}
  ],
  vos:[{id:'VO-001',projectId:'PRJ-001',project:'Condo Renovation - 28A',reason:'Additional storage requested by client',items:[{desc:'Kitchen Base Cabinet - Pull-out',type:'Added',qty:1,price:680},{desc:'Bathroom Faucet Upgrade',type:'Changed',qty:2,price:320}],status:'Pending'}],
  pos:[{id:'PO-001',projectId:'PRJ-001',supplier:'Supply Builders Pte Ltd',delivery:'2025-06-05',items:[{desc:'Porcelain Tile',cat:'Tiles',qty:120,price:28},{desc:'Kitchen Cabinet Package',cat:'Carpentry',qty:1,price:8500}],status:'Draft'}],
  dos:[{id:'DO-001',projectId:'PRJ-001',receiver:'Aiden Wong',signed:false,items:['Kitchen Cabinet','Kitchen Countertop','Wardrobe','Tiling','Painting'].map(x=>({desc:x,done:true})),status:'Draft'}],
  invoices:[{id:'INV-001',projectId:'PRJ-001',project:'Condo Renovation - 28A',client:'Jessica Tan',amount:18225,due:'2025-05-26',status:'Partially Paid',schedule:[{stage:'Deposit',amount:5467.5,received:5467.5},{stage:'Hacking & Plumbing',amount:5467.5,received:2757.5},{stage:'Carpentry & Tiling',amount:3645,received:0},{stage:'Final Handover',amount:3645,received:0}],payments:[{date:'2025-05-12',method:'Bank Transfer',amount:5467.5,ref:'RCPT-1001'},{date:'2025-05-24',method:'Bank Transfer',amount:2757.5,ref:'RCPT-1034'}]}],
  warranties:[{id:'WC-001',projectId:'PRJ-001',project:'Condo Renovation - 28A',client:'Jessica Tan',issue:'Grout cracks observed on shower wall tiles.',action:'Removed affected grout and resealed with waterproof epoxy.',estimated:320,actual:285,manpower:'2 technicians',status:'In Progress',media:[]}],
  media:[]
};

let state = JSON.parse(localStorage.getItem('bd-v03') || 'null') || seed;
let active = 'dashboard';
function save(){ localStorage.setItem('bd-v03', JSON.stringify(state)); }
function reset(){ if(confirm('Reset all demo data?')){ localStorage.removeItem('bd-v03'); state=JSON.parse(JSON.stringify(seed)); show(active); toast('Demo data reset'); } }
function cls(s){return {'Paid':'greenp','In Progress':'greenp','Planning':'bluep','Handover':'orangep','On Hold':'redp','Pending':'orangep','Partial':'orangep','Partially Paid':'orangep','Completed':'greenp','Draft':'bluep','Active':'greenp','Approved':'greenp','Closed':'greenp'}[s]||'bluep'}
function pill(s){return `<span class="pill ${cls(s)}">${s}</span>`}
function head(t,s,c,a=''){return `<div class="head"><div><div class="crumb">${c}</div><h1>${t}</h1><p class="sub">${s}</p></div><div class="actions">${a}</div></div>`}
function field(id,label,value='',type='text',opts=''){ if(type==='textarea')return `<div class="field"><label>${label}</label><textarea id="${id}">${value||''}</textarea></div>`; if(type==='select')return `<div class="field"><label>${label}</label><select id="${id}">${opts.split('|').map(o=>`<option ${o==value?'selected':''}>${o}</option>`).join('')}</select></div>`; return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${value??''}"></div>`}
function quoteTotal(q){return q.items.reduce((a,b)=>a+(+b.price||0)*(+b.qty||0),0)}
function quoteCost(q){return q.items.reduce((a,b)=>a+(+b.cost||0)*(+b.qty||0),0)}
function invPaid(inv){return inv.payments.reduce((a,b)=>a+(+b.amount||0),0)}
function modal(html){$('modalBody').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function exportJSON(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='brick-decor-demo-data.json'; a.click(); }
function printDoc(title, body){ const w=window.open('','_blank'); w.document.write(`<html><head><title>${title}</title><style>body{font-family:Arial;margin:36px;color:#222}h1{color:#ff5b5f}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px;text-align:left}th{background:#f7f7f7}.right{text-align:right}</style></head><body><h1>BRICK & DECOR</h1><h2>${title}</h2>${body}<script>window.print()<\/script></body></html>`); w.document.close(); }

function layout(){
  $('app').innerHTML = `<div class="app"><aside class="sidebar"><div class="brand"><div class="logo"></div><b>BRICK & DECOR</b></div><nav class="nav">${NAV.map(([id,ico,label])=>`<button class="${active===id?'active':''}" onclick="show('${id}')"><span>${ico}</span>${label}</button>`).join('')}</nav><div class="promo"><b>Usable Test v0.3.1</b><p>LocalStorage test version. Add, edit, delete, record payment, generate print documents and export data.</p></div></aside><main class="main"><div class="topbar"><input class="search" placeholder="Search anything..." oninput="filterText=this.value.toLowerCase();show(active)"><div class="user"><button class="btn small" onclick="exportJSON()">Export JSON</button><button class="btn small red" onclick="reset()">Reset</button><div class="avatar">A</div><div><b>Admin</b><div class="small">Superadmin</div></div></div></div><div class="content" id="content"></div></main></div>`;
}
let filterText='';
function show(id){active=id;layout();$('content').innerHTML=pages[id]();save();}

const pages={};
pages.dashboard=()=>{
 const sales=state.quotes.reduce((a,q)=>a+quoteTotal(q),0)+state.vos.reduce((a,v)=>a+v.items.reduce((x,i)=>x+i.qty*i.price,0),0);
 const actual=state.costs.reduce((a,c)=>a+(+c.actual||0),0), warranty=state.warranties.reduce((a,w)=>a+(+w.actual||0),0), paid=state.invoices.reduce((a,i)=>a+invPaid(i),0), invTotal=state.invoices.reduce((a,i)=>a+i.amount,0);
 return head('Dashboard','Live test overview generated from local demo data.','Dashboard',"<button class='btn primary' onclick=\"show('clients')\">+ New Case</button>")+
 `<div class="grid kpis">${[['Total Sales',sales,'💼'],['Pending Payment',Math.max(invTotal-paid,0),'💰'],['Active Projects',state.projects.length,'🧰'],['Gross Profit',sales-actual-warranty,'📈'],['Warranty Cases',state.warranties.length,'🛡️'],['Commission Est.',Math.max((sales-actual)*.1,0),'💸']].map(x=>`<div class="card"><div>${x[2]}</div><div class="small">${x[0]}</div><div class="money">${typeof x[1]==='number'&&x[1]>50?money0(x[1]):x[1]}</div><div class="up">usable test data</div></div>`).join('')}</div>
 <div class="grid two" style="margin-top:16px"><div class="card"><h3>Project Status</h3><div class="donut"></div></div><div class="card"><h3>Payment Collection Progress</h3><div class="money">${money0(paid)}</div><div class="small">of ${money0(invTotal)}</div><br><div class="progress greenbar"><span style="width:${invTotal?paid/invTotal*100:0}%"></span></div><br><div class="grid three"><div><b>Paid</b><br>${money0(paid)}</div><div><b>Pending</b><br>${money0(Math.max(invTotal-paid,0))}</div><div><b>Overdue</b><br>${money0(Math.max(invTotal-paid-4000,0))}</div></div></div></div>
 <div class="card" style="margin-top:16px"><h3>Projects</h3>${projectTable()}</div>`;
}
function projectTable(){
 const rows=state.projects.filter(p=>(p.name+p.client+p.salesperson).toLowerCase().includes(filterText||''));
 return `<table><thead><tr><th>Project</th><th>Client</th><th>ID</th><th>Status</th><th>Progress</th><th>Site</th><th>Action</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.client}</td><td>${p.salesperson}</td><td>${pill(p.status)}</td><td><b>${p.progress}%</b><div class="progress"><span style="width:${p.progress}%"></span></div></td><td>${p.site}</td><td><button class="btn small" onclick="openProject('${p.id}')">Open</button></td></tr>`).join('')}</tbody></table>`;
}
window.openProject=id=>{state.selectedProject=id;show('projects')}

pages.clients=()=>head('Clients / Case Opening','Create, edit and delete client project cases for testing.','Clients > Case Opening','<button class="btn primary" onclick="newCase()">+ Create Case</button>')+
`<div class="card"><h3>Case List</h3>${projectTable()}</div>`;
window.newCase=()=>modal(`<h2>Create New Case</h2><div class="form">${field('m_client','Client Name','New Client')}${field('m_phone','Phone','+65 ')}${field('m_email','Email','client@email.com')}${field('m_project','Project Name','New Renovation Project')}${field('m_type','Project Type','Kitchen Renovation|Full Renovation|Office Reinstatement','select')}${field('m_site','Site Address','Singapore')}${field('m_sales','Salesperson / ID','Alex Wong')}${field('m_warranty','Warranty','12 Months|24 Months|36 Months','select')}</div><br><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCase()">Create Case</button></div>`);
window.saveCase=()=>{const cid=uid('C');state.clients.push({id:cid,type:'Individual',name:$('m_client').value,phone:$('m_phone').value,email:$('m_email').value,address:$('m_site').value,notes:''});state.projects.push({id:uid('PRJ'),name:$('m_project').value,clientId:cid,client:$('m_client').value,salesperson:$('m_sales').value,type:$('m_type').value,site:$('m_site').value,status:'Planning',progress:0,warranty:$('m_warranty').value,start:now(),target:now()});closeModal();toast('Case created');show('clients')};

pages.quotation=()=>{let q=state.quotes[0];return head('Quotation Builder','Add quotation items, validate pricing range, save and generate printable quotation.','Quotations > Builder','<button class="btn" onclick="addQuoteItem()">+ Add Item</button><button class="btn red" onclick="printQuote()">Generate PDF / Print</button><button class="btn primary" onclick="approveQuote()">Submit for Approval</button>')+
`<div class="grid sidegrid"><div><div class="grid three"><div class="card"><h3>Client</h3>${q.client}</div><div class="card"><h3>Project</h3>${q.project}<br>ID: ${q.salesperson}</div><div class="card"><h3>Status</h3>${pill(q.status)}</div></div><div class="notice"><b>Rule:</b> price must be between ${state.settings.normalMarkup}% and ${state.settings.maxMarkup}% markup. Try changing the price to test validation.</div><div class="card"><h3>Quotation Items</h3><table><thead><tr><th>Item</th><th>Cost</th><th>Allowed Range</th><th>Qty</th><th>Your Price</th><th>Amount</th><th></th></tr></thead><tbody>${q.items.map((i,idx)=>{let min=i.cost*(1+state.settings.normalMarkup/100),max=i.cost*(1+state.settings.maxMarkup/100),ok=i.price>=min&&i.price<=max;return `<tr><td><b>${i.desc}</b><br><span class="small">${i.cat}</span></td><td>${money(i.cost)}</td><td>${money(min)} - ${money(max)}</td><td><input value="${i.qty}" type="number" min="1" style="width:64px" onchange="quoteEdit(${idx},'qty',this.value)"></td><td><input class="${ok?'ok':'bad'}" value="${i.price}" type="number" style="width:110px" onchange="quoteEdit(${idx},'price',this.value)"></td><td>${money(i.qty*i.price)}</td><td><span class="danger" onclick="deleteQuoteItem(${idx})">Delete</span></td></tr>`}).join('')}</tbody></table></div></div><div class="card"><h3>Pricing Summary</h3><div class="small">Approximate Cost</div><div class="money">${money(quoteCost(q))}</div><br><div class="small">Total Quotation</div><div class="total">${money(quoteTotal(q))}</div><br><div>${q.items.every(i=>i.price>=i.cost*1.3&&i.price<=i.cost*1.4)?pill('Approved').replace('Approved','All prices valid'):pill('On Hold').replace('On Hold','Some price invalid')}</div></div></div>`}
window.quoteEdit=(idx,k,v)=>{let q=state.quotes[0];q.items[idx][k]=Number(v)||0;show('quotation')};
window.deleteQuoteItem=idx=>{state.quotes[0].items.splice(idx,1);toast('Item deleted');show('quotation')};
window.addQuoteItem=()=>modal(`<h2>Add Quotation Item</h2><div class="form">${field('qi_item','Item',state.items[0].desc,'select',state.items.map(i=>i.desc).join('|'))}${field('qi_qty','Qty','1','number')}${field('qi_price','Your Price','0','number')}</div><p class="small">Tip: select an item, then use a price between the 30%–40% markup range.</p><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveQuoteItem()">Add Item</button></div>`);
window.saveQuoteItem=()=>{let master=state.items.find(i=>i.desc==$('qi_item').value);let price=+$('qi_price').value||master.cost*1.3;state.quotes[0].items.push({itemId:master.id,desc:master.desc,cat:master.cat,qty:+$('qi_qty').value||1,unit:master.unit,cost:master.cost,price});closeModal();toast('Quotation item added');show('quotation')};
window.approveQuote=()=>{state.quotes[0].status='Pending Approval';toast('Quotation submitted for approval');show('quotation')};
window.printQuote=()=>{let q=state.quotes[0];printDoc('Quotation '+q.id,`<p>Client: ${q.client}<br>Project: ${q.project}</p><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Amount</th></tr>${q.items.map(i=>`<tr><td>${i.desc}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}<tr><th colspan="3" class="right">Total</th><th>${money(quoteTotal(q))}</th></tr></table>`)}
pages.projects=()=>{let p=state.projects.find(x=>x.id==(state.selectedProject||state.projects[0].id))||state.projects[0];let pcosts=state.costs.filter(c=>c.projectId==p.id),budget=pcosts.reduce((a,c)=>a+c.budget,0),actual=pcosts.reduce((a,c)=>a+c.actual,0),committed=pcosts.reduce((a,c)=>a+c.committed,0);return head(p.name,'Add and delete real costs. This updates dashboard and profit report.','Projects > Real Cost','<button class="btn primary" onclick="addCost()">+ Add Cost Entry</button>')+
`<div class="card"><b>Client:</b> ${p.client} &nbsp; <b>Site:</b> ${p.site} &nbsp; ${pill(p.status)}<div class="tabs"><span>Overview</span><span class="active">Real Cost</span><span>Manpower</span><span>Timeline</span><span>Media Upload</span><span>VO</span><span>PO</span><span>DO</span></div><div class="grid four"><div class="card"><div class="small">Budget</div><div class="money">${money(budget)}</div></div><div class="card"><div class="small">Actual</div><div class="money">${money(actual)}</div></div><div class="card"><div class="small">Committed</div><div class="money">${money(committed)}</div></div><div class="card"><div class="small">Projected</div><div class="money">${money(actual+committed)}</div></div></div><br><h3>Cost Entries</h3><table><thead><tr><th>Category</th><th>Description</th><th>Supplier</th><th>Budget</th><th>Actual</th><th>Committed</th><th>Status</th><th></th></tr></thead><tbody>${pcosts.map(c=>`<tr><td>${c.cat}</td><td>${c.desc}</td><td>${c.supplier}</td><td>${money(c.budget)}</td><td>${money(c.actual)}</td><td>${money(c.committed)}</td><td>${pill(c.status)}</td><td><span class="danger" onclick="delCost('${c.id}')">Delete</span></td></tr>`).join('')}</tbody></table></div>`}
window.addCost=()=>{let p=state.projects.find(x=>x.id==(state.selectedProject||state.projects[0].id));modal(`<h2>Add Cost Entry</h2><div class="form">${field('co_cat','Category','Materials|Manpower|Transport|Misc','select')}${field('co_desc','Description','New cost')}${field('co_supplier','Supplier / Paid To','Internal Team')}${field('co_budget','Budget','0','number')}${field('co_actual','Actual Cost','0','number')}${field('co_committed','Committed Cost','0','number')}${field('co_status','Status','Paid|Partial|Pending','select')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveCost('${p.id}')">Save Cost</button>`)};
window.saveCost=pid=>{state.costs.push({id:uid('COST'),projectId:pid,cat:$('co_cat').value,desc:$('co_desc').value,supplier:$('co_supplier').value,ref:'TEST',date:now(),budget:+$('co_budget').value||0,actual:+$('co_actual').value||0,committed:+$('co_committed').value||0,status:$('co_status').value});closeModal();toast('Cost added');show('projects')};
window.delCost=id=>{state.costs=state.costs.filter(c=>c.id!=id);toast('Cost deleted');show('projects')};
pages.vo=()=>head('Variation Order','Create VO items and generate a printable VO.','VO','<button class="btn primary" onclick="addVO()">+ Add VO</button><button class="btn red" onclick="printVO()">Generate VO PDF / Print</button>')+`<div class="card"><h3>VO List</h3><table><thead><tr><th>VO</th><th>Project</th><th>Reason</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${state.vos.map(v=>`<tr><td>${v.id}</td><td>${v.project}</td><td>${v.reason}</td><td>${money(v.items.reduce((a,i)=>a+i.qty*i.price,0))}</td><td>${pill(v.status)}</td><td><span class="click" onclick="approveVO('${v.id}')">Approve</span></td></tr>`).join('')}</tbody></table></div>`;
window.addVO=()=>modal(`<h2>Add VO</h2><div class="form">${field('vo_reason','Reason','Client requested additional work')}${field('vo_item','Item','Additional cabinet')}${field('vo_qty','Qty','1','number')}${field('vo_price','Unit Price','500','number')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveVO()">Save VO</button>`);
window.saveVO=()=>{let p=state.projects[0];state.vos.push({id:uid('VO'),projectId:p.id,project:p.name,reason:$('vo_reason').value,items:[{desc:$('vo_item').value,type:'Added',qty:+$('vo_qty').value||1,price:+$('vo_price').value||0}],status:'Pending'});closeModal();toast('VO added');show('vo')};
window.approveVO=id=>{let v=state.vos.find(x=>x.id==id);v.status='Approved';toast('VO approved');show('vo')};
window.printVO=()=>{let v=state.vos[0];printDoc('Variation Order '+v.id,`<p>Project: ${v.project}<br>Reason: ${v.reason}</p><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Amount</th></tr>${v.items.map(i=>`<tr><td>${i.desc}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</table>`)}
pages.po=()=>head('Purchase Order','Create supplier PO and approve it for testing.','PO','<button class="btn primary" onclick="addPO()">+ Add PO</button><button class="btn red" onclick="printPO()">Generate PO PDF / Print</button>')+`<div class="card"><h3>Purchase Orders</h3><table><thead><tr><th>PO</th><th>Supplier</th><th>Delivery</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${state.pos.map(po=>`<tr><td>${po.id}</td><td>${po.supplier}</td><td>${po.delivery}</td><td>${money(po.items.reduce((a,i)=>a+i.qty*i.price,0))}</td><td>${pill(po.status)}</td><td><span class="click" onclick="approvePO('${po.id}')">Approve</span></td></tr>`).join('')}</tbody></table></div>`;
window.addPO=()=>modal(`<h2>Add PO</h2><div class="form">${field('po_supplier','Supplier','New Supplier Pte Ltd')}${field('po_delivery','Delivery Date',now(),'date')}${field('po_item','Item','Material item')}${field('po_qty','Qty','1','number')}${field('po_price','Unit Cost','100','number')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="savePO()">Save PO</button>`);
window.savePO=()=>{let p=state.projects[0];state.pos.push({id:uid('PO'),projectId:p.id,supplier:$('po_supplier').value,delivery:$('po_delivery').value,items:[{desc:$('po_item').value,cat:'Material',qty:+$('po_qty').value||1,price:+$('po_price').value||0}],status:'Draft'});closeModal();toast('PO added');show('po')};
window.approvePO=id=>{state.pos.find(x=>x.id==id).status='Approved';toast('PO approved');show('po')};
window.printPO=()=>{let po=state.pos[0];printDoc('Purchase Order '+po.id,`<p>Supplier: ${po.supplier}<br>Delivery: ${po.delivery}</p><table>${po.items.map(i=>`<tr><td>${i.desc}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</table>`)}
pages.do=()=>{let d=state.dos[0];return head('Delivery Order / Handover','Tick completed items, capture signature text and record handover.','DO / Handover','<button class="btn red" onclick="printDO()">Generate DO PDF / Print</button><button class="btn primary" onclick="recordDO()">Record Handover</button>')+`<div class="grid two"><div class="card"><h3>Checklist</h3><table><thead><tr><th>Done</th><th>Item</th></tr></thead><tbody>${d.items.map((i,idx)=>`<tr><td><input type="checkbox" ${i.done?'checked':''} onchange="toggleDO(${idx},this.checked)"></td><td>${i.desc}</td></tr>`).join('')}</tbody></table></div><div class="card"><h3>Handover Confirmation</h3>${field('do_receiver','Received By',d.receiver)}${field('do_sig','Signature Text',d.signed?'Signed by '+d.receiver:'')}<br>${pill(d.status)}</div></div>`}
window.toggleDO=(i,val)=>{state.dos[0].items[i].done=val;save()};
window.recordDO=()=>{state.dos[0].receiver=$('do_receiver').value;state.dos[0].signed=true;state.dos[0].status='Completed';toast('Handover recorded');show('do')};
window.printDO=()=>{let d=state.dos[0];printDoc('Delivery Order '+d.id,`<p>Receiver: ${d.receiver}<br>Status: ${d.status}</p><ul>${d.items.map(i=>`<li>${i.done?'✓':'□'} ${i.desc}</li>`).join('')}</ul>`)}
pages.invoices=()=>{let inv=state.invoices[0], paid=invPaid(inv), pending=inv.amount-paid;return head('Invoices & Payments','Record payments and send reminder for staged billing.','Invoices & Payments','<button class="btn primary" onclick="recordPayment()">Record Payment</button><button class="btn red" onclick="printInvoice()">Generate Invoice PDF / Print</button>')+`<div class="grid four"><div class="card"><div class="small">Invoice Amount</div><div class="money">${money(inv.amount)}</div></div><div class="card"><div class="small">Received</div><div class="money">${money(paid)}</div></div><div class="card"><div class="small">Pending</div><div class="money">${money(pending)}</div></div><div class="card"><div class="small">Status</div>${pill(pending<=0?'Paid':inv.status)}</div></div><br><div class="card"><h3>Payment Schedule</h3><table><thead><tr><th>Stage</th><th>Amount</th><th>Received</th><th>Status</th></tr></thead><tbody>${inv.schedule.map(s=>`<tr><td>${s.stage}</td><td>${money(s.amount)}</td><td>${money(s.received)}</td><td>${pill(s.received>=s.amount?'Paid':s.received>0?'Partially Paid':'Pending')}</td></tr>`).join('')}</tbody></table></div><br><div class="card"><h3>Payment History</h3><table><thead><tr><th>Date</th><th>Method</th><th>Amount</th><th>Ref</th></tr></thead><tbody>${inv.payments.map(p=>`<tr><td>${p.date}</td><td>${p.method}</td><td>${money(p.amount)}</td><td>${p.ref}</td></tr>`).join('')}</tbody></table></div>`}
window.recordPayment=()=>modal(`<h2>Record Payment</h2><div class="form">${field('pay_date','Date',now(),'date')}${field('pay_method','Method','Bank Transfer|PayNow|Credit Card|Cash','select')}${field('pay_amt','Amount','1000','number')}${field('pay_ref','Reference','RCPT-'+Math.floor(Math.random()*9999))}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="savePayment()">Save Payment</button>`);
window.savePayment=()=>{let inv=state.invoices[0];let amt=+$('pay_amt').value||0;inv.payments.push({date:$('pay_date').value,method:$('pay_method').value,amount:amt,ref:$('pay_ref').value});let remaining=amt;for(const s of inv.schedule){let need=s.amount-s.received;if(remaining>0&&need>0){let add=Math.min(remaining,need);s.received+=add;remaining-=add}}if(invPaid(inv)>=inv.amount)inv.status='Paid';closeModal();toast('Payment recorded');show('invoices')};
window.printInvoice=()=>{let inv=state.invoices[0];printDoc('Invoice '+inv.id,`<p>Client: ${inv.client}<br>Project: ${inv.project}</p><p>Total: ${money(inv.amount)}<br>Paid: ${money(invPaid(inv))}<br>Pending: ${money(inv.amount-invPaid(inv))}</p>`)}
pages.warranty=()=>head('Warranty & Media','Add warranty claims, repair costs and local media previews.','Warranty & Media','<button class="btn primary" onclick="addWarranty()">+ Add Warranty Case</button>')+`<div class="grid two">${state.warranties.map(w=>`<div class="card"><h3>${w.id} ${pill(w.status)}</h3><p><b>${w.project}</b><br>${w.issue}</p><p><b>Repair:</b> ${w.action}</p><p>Estimated: ${money(w.estimated)} | Actual: ${money(w.actual)} | Manpower: ${w.manpower}</p><div class="uploads">${(w.media||[]).map(m=>`<div class="thumb" style="background-image:url('${m}')"></div>`).join('')}<label class="upload">+ Upload<input type="file" accept="image/*" style="display:none" onchange="saveMedia('${w.id}',this)"></label></div><br><button class="btn green" onclick="closeWarranty('${w.id}')">Close Case</button></div>`).join('')}</div>`;
window.addWarranty=()=>modal(`<h2>Add Warranty Case</h2><div class="form">${field('wa_issue','Issue','New warranty issue','textarea')}${field('wa_action','Repair Action','Repair action','textarea')}${field('wa_est','Estimated Cost','0','number')}${field('wa_actual','Actual Cost','0','number')}${field('wa_man','Manpower Used','1 technician')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveWarranty()">Save Case</button>`);
window.saveWarranty=()=>{let p=state.projects[0];state.warranties.push({id:uid('WC'),projectId:p.id,project:p.name,client:p.client,issue:$('wa_issue').value,action:$('wa_action').value,estimated:+$('wa_est').value||0,actual:+$('wa_actual').value||0,manpower:$('wa_man').value,status:'In Progress',media:[]});closeModal();toast('Warranty case added');show('warranty')};
window.closeWarranty=id=>{state.warranties.find(w=>w.id==id).status='Closed';toast('Warranty case closed');show('warranty')};
window.saveMedia=(id,input)=>{let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{let w=state.warranties.find(x=>x.id==id);w.media=w.media||[];w.media.push(r.result);toast('Media preview saved locally');show('warranty')};r.readAsDataURL(file)};
pages.profit=()=>{const sales=state.quotes.reduce((a,q)=>a+quoteTotal(q),0)+state.vos.reduce((a,v)=>a+v.items.reduce((x,i)=>x+i.qty*i.price,0),0);const actual=state.costs.reduce((a,c)=>a+c.actual,0);const warranty=state.warranties.reduce((a,w)=>a+w.actual,0);const gross=sales-actual-warranty;const commission=Math.max(gross*.1,0);return head('Profit & Commission','Live report from quotation, VO, actual cost, warranty and payment test data.','Reports','<button class="btn primary" onclick="exportJSON()">Export Report Data</button>')+`<div class="grid kpis">${[['Total Sales',sales],['Actual Cost',actual],['Warranty Cost',warranty],['Gross Profit',gross],['Commission Est.',commission],['Profit Margin',sales?(gross/sales*100).toFixed(1)+'%':'0%']].map(x=>`<div class="card"><div class="small">${x[0]}</div><div class="money">${typeof x[1]==='number'?money0(x[1]):x[1]}</div></div>`).join('')}</div><br><div class="card"><h3>Project Profit Comparison</h3><table><thead><tr><th>Project</th><th>Salesperson</th><th>Sales</th><th>Actual Cost</th><th>Warranty</th><th>Profit</th></tr></thead><tbody>${state.projects.map(p=>{let qs=state.quotes.filter(q=>q.projectId==p.id).reduce((a,q)=>a+quoteTotal(q),0);let vo=state.vos.filter(v=>v.projectId==p.id).reduce((a,v)=>a+v.items.reduce((x,i)=>x+i.qty*i.price,0),0);let c=state.costs.filter(c=>c.projectId==p.id).reduce((a,c)=>a+c.actual,0);let w=state.warranties.filter(w=>w.projectId==p.id).reduce((a,w)=>a+w.actual,0);return `<tr><td>${p.name}</td><td>${p.salesperson}</td><td>${money(qs+vo)}</td><td>${money(c)}</td><td>${money(w)}</td><td class="${qs+vo-c-w>=0?'up':'down'}">${money(qs+vo-c-w)}</td></tr>`}).join('')}</tbody></table></div>`}
pages.master=()=>head('Master Data','Edit superadmin settings and item master. Changes affect quotation validation.','Master Data','<button class="btn primary" onclick="saveSettings()">Save Settings</button><button class="btn" onclick="addMasterItem()">+ Add Item</button>')+`<div class="grid three"><div class="card"><h3>Pricing Rules</h3>${field('set_normal','Normal Markup %',state.settings.normalMarkup,'number')}${field('set_max','Max ID Markup %',state.settings.maxMarkup,'number')}${field('set_above','Approval Above %',state.settings.approvalAbove,'number')}</div><div class="card"><h3>Warranty</h3>${field('set_labor','Default Labor Warranty',state.settings.laborWarranty)}${field('set_material','Material Warranty',state.settings.materialWarranty)}</div><div class="card"><h3>Manpower Rates</h3>${field('rate_carpenter','Carpenter / Hour',state.settings.rates.carpenter,'number')}${field('rate_installer','Installer / Hour',state.settings.rates.installer,'number')}${field('rate_technician','Technician / Hour',state.settings.rates.technician,'number')}</div></div><br><div class="card"><h3>Item Master</h3><table><thead><tr><th>Item</th><th>Category</th><th>Unit</th><th>Cost</th><th>Min</th><th>Max</th><th></th></tr></thead><tbody>${state.items.map(i=>`<tr><td>${i.desc}</td><td>${i.cat}</td><td>${i.unit}</td><td>${money(i.cost)}</td><td>${money(i.cost*(1+state.settings.normalMarkup/100))}</td><td>${money(i.cost*(1+state.settings.maxMarkup/100))}</td><td><span class="danger" onclick="delMasterItem('${i.id}')">Delete</span></td></tr>`).join('')}</tbody></table></div>`;
window.saveSettings=()=>{state.settings.normalMarkup=+$('set_normal').value||30;state.settings.maxMarkup=+$('set_max').value||40;state.settings.approvalAbove=+$('set_above').value||40;state.settings.laborWarranty=$('set_labor').value;state.settings.materialWarranty=$('set_material').value;state.settings.rates={carpenter:+$('rate_carpenter').value||0,installer:+$('rate_installer').value||0,technician:+$('rate_technician').value||0};toast('Settings saved');show('master')};
window.addMasterItem=()=>modal(`<h2>Add Master Item</h2><div class="form">${field('mi_desc','Item Description','New Item')}${field('mi_cat','Category','Carpentry|Tiles|Electrical|Surface|Labour','select')}${field('mi_unit','Unit','Lot')}${field('mi_cost','Approx Cost','1000','number')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveMasterItem()">Save Item</button>`);
window.saveMasterItem=()=>{state.items.push({id:uid('IT'),desc:$('mi_desc').value,cat:$('mi_cat').value,unit:$('mi_unit').value,cost:+$('mi_cost').value||0});closeModal();toast('Master item added');show('master')};
window.delMasterItem=id=>{state.items=state.items.filter(i=>i.id!=id);toast('Master item deleted');show('master')};
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
show('dashboard');
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
