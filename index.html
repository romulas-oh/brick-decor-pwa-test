function newCase(){let cos=S.companies.filter(c=>canCo(c.id));modal(`<h2>Create Case File</h2><div class="warnbox">Enter fixed client/site details once. Quotation revisions and future documents inherit this case information automatically.</div><div class="form">${field('nc_co','Issuing Company',cos[0]?.id||'','select',cos.map(c=>c.id).join('|'))}${field('nc_client','Client / Customer Name','New Client')}${field('nc_nric','NRIC / UEN (optional)','')}${field('nc_phone','Contact No.','')}${field('nc_email','Fax / Email','')}${field('nc_name','Case / Project Name','New Renovation Project')}${field('nc_type','Property / Project Type','Condo Renovation|HDB Renovation|Commercial Fit-out|Office Reinstatement|Other','select')}${field('nc_site','Project / Renovation Address','')}${field('nc_postal','Postal Code','')}${field('nc_lead','Lead Source','Referral|Website|Instagram|Walk-in|Repeat Client|Other','select')}${field('nc_budget','Estimated Budget','0','number')}${field('nc_id','Assigned ID / Served By',user().id,'select',S.users.map(u=>u.id).join('|'))}${field('nc_pm','Project Manager','U4','select',S.users.map(u=>u.id).join('|'))}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveCase()">Create Case</button>`)}
function saveCase(){let id=$('nc_id').value,pm=$('nc_pm').value,p={id:uid('P'),co:$('nc_co').value,client:$('nc_client').value,nric:$('nc_nric').value,phone:$('nc_phone').value,email:$('nc_email').value,name:$('nc_name').value,type:$('nc_type').value,site:$('nc_site').value,postal:$('nc_postal').value,lead:$('nc_lead').value,budget:+$('nc_budget').value||0,idUser:id,pm:pm,status:'Quotation Draft',progress:0,start:today(),target:today(),createdBy:user().id,assigned:[id,pm,user().id],activity:[],closeRequest:null,closingSnapshot:null};S.projects.push(p);activity(p,'Case created','Fixed client/company/site information saved.');caseDetail=p.id;caseSub='overview';closeModal();toast('Case file created');show('cases')}

 let p=S.projects.find(x=>x.id==caseDetail);if(!p||!canP(p)){caseDetail='';return '<div class="card">No access to this case.</div>'}
 let qs=caseQuotes(p.id),sup=caseSup(p.id),invs=caseInvoices(p.id),cost=caseCost(p.id),sales=caseSales(p.id),profit=sales-cost;
 let action='';
 if(p.status=='Closure Requested'&&user().role=='Superadmin')action=`<button class="btn g" onclick="approveClose('${p.id}')">Approve Closure</button><button class="btn r" onclick="returnClose('${p.id}')">Return to ID</button>`;
 else if(p.status!='Closed'&&canSubmitClose(p))action=`<button class="btn r" onclick="requestClose('${p.id}')">Submit Case for Closure</button>`;
 return head(p.name,'Case File • '+p.site,'Case File',`<button class="btn" onclick="caseDetail='';show('cases')">← Case Overview</button>${action}`)+`
 <div class="caseHero"><div><span class="small">${esc(co(p.co).name)}</span><h2>${esc(p.client)}</h2><div>${esc(p.site)} ${esc(p.postal||'')}</div><div class="small" style="margin-top:6px">Assigned ID: ${esc(uname(p.idUser))} • Project Manager: ${esc(uname(p.pm))}</div></div><div><span class="caseStage">${esc(p.status)}</span></div></div>
 <div class="caseStats">
  <div class="caseStat"><span class="small">Quotation Revisions</span><div class="v">${qs.reduce((a,q)=>a+q.versions.length,0)}</div></div>
  <div class="caseStat"><span class="small">Contract / Sales</span><div class="v">${money0(sales)}</div></div>
  <div class="caseStat"><span class="small">Actual Cost</span><div class="v">${money0(cost)}</div></div>
  <div class="caseStat"><span class="small">Supplier Unpaid</span><div class="v">${money0(supplierOutstanding(p.id))}</div></div>
  <div class="caseStat"><span class="small">Customer Outstanding</span><div class="v">${money0(customerOutstanding(p.id))}</div></div>
  <div class="caseStat"><span class="small">Projected Profit</span><div class="v">${money0(profit)}</div></div>
 </div>
 <div class="caseTabs">${[['overview','Overview'],['quotation','Quotation'],['supplier','Supplier Cost'],['cost','Project Cost'],['vo','VO'],['invoice','Customer Invoice'],['payment','Payment'],['handover','DO / Handover'],['profit','Profit'],['activity','Activity Log']].map(x=>`<button class="${caseSub==x[0]?'active':''}" onclick="caseSub='${x[0]}';show('cases')">${x[1]}</button>`).join('')}</div>
 <div class="card">${caseSub=='overview'?caseOverviewTab(p):caseSub=='quotation'?caseQuoteTab(p):caseSub=='supplier'?caseSupplierTab(p):caseSub=='cost'?caseCostTab(p):caseSub=='vo'?caseVOTab(p):caseSub=='invoice'?caseInvoiceTab(p):caseSub=='payment'?casePaymentTab(p):caseSub=='handover'?caseHandoverTab(p):caseSub=='profit'?caseProfitTab(p):caseActivityTab(p)}</div>`}

function requestClose(pid){let p=S.projects.find(x=>x.id==pid);if(!canSubmitClose(p)){toast('Only assigned ID or authorised user can submit closure');return}let pending=caseSup(pid).filter(s=>s.approve=='Pending Verification').length,vo=caseVO(pid).filter(v=>v.status=='Pending').length,cust=customerOutstanding(pid),sup=supplierOutstanding(pid);modal(`<h2>Submit Case for Closure</h2>${pending?`<div class="dangerbox">${pending} supplier invoice(s) still pending verification.</div><br>`:''}${vo?`<div class="dangerbox">${vo} VO(s) still pending.</div><br>`:''}<div class="warnbox">Customer outstanding: ${money(cust)}<br>Supplier outstanding: ${money(sup)}<br><br>Outstanding money does not automatically block closure, but Superadmin will see it before final approval.</div>${field('close_remark','Closure Remark','','textarea','','full')}<button class="btn" onclick="closeModal()">Cancel</button> <button class="btn r" onclick="confirmCloseRequest('${pid}')">Submit to Superadmin</button>`)}

function quoteOverview(){let pids=S.projects.filter(canP).map(p=>p.id);let rows=S.quotes.filter(q=>pids.includes(q.p));rows=base(rows,q=>({...q,date:q.created,worker:q.idUser,status:isFollow(q)?'Follow-up Required':q.status}));return head('Quotation Overview','Filter by ID, company and date. Best flow is Case File → Quotation; direct creation is still available for flexibility.','Quotation','<button class="btn p" onclick="newQuote()">+ New Quotation</button>')+fb('quotation')+`<div class="card"><h3>Quotation List</h3><div class="wrap"><table><tr><th>Quotation</th><th>Company</th><th>Client / Site</th><th>ID</th><th>Created</th><th>Last Sent</th><th>Revisions</th><th>Status</th><th>Total</th><th>Action</th></tr>${rows.map(q=>{let p=S.projects.find(x=>x.id==q.p)||{};return `<tr><td><b>${q.id}</b></td><td>${esc(co(q.co).name)}</td><td>${esc(q.client)}<br><span class="small">${esc(p.site||q.project)}</span></td><td>${uname(q.idUser)}</td><td>${q.created}</td><td>${q.lastSent||'-'}</td><td>${q.versions.length}</td><td>${pill(isFollow(q)?'Follow-up Required':q.status)}</td><td>${money(qgrand(q))}</td><td><button class="btn s" onclick="qDetail='${q.id}';show('quotation')">Open</button> <button class="btn s" onclick="caseDetail='${q.p}';caseSub='quotation';show('cases')">Case</button></td></tr>`}).join('')}</table></div></div>`}
function quoteDetail(){let q=S.quotes.find(x=>x.id==qDetail),c=co(q.co),p=S.projects.find(x=>x.id==q.p)||{},miss=missingQuote(q),allValid=q.items.every(qvalid),groups={};q.items.forEach((it,n)=>{let a=it.area||'Unassigned Area',s=it.section||'General Works';groups[a]=groups[a]||{};groups[a][s]=groups[a][s]||[];groups[a][s].push({it,n})});return head('Quotation Builder','The main view is presented like a quotation, not a database form. Click Edit on an item when changes are needed.','Quotation Detail','<button class="btn" onclick="qDetail=\'\';show(\'quotation\')">← Overview</button><button class="btn" onclick="caseDetail=\''+q.p+'\';caseSub=\'quotation\';show(\'cases\')">Open Case</button><button class="btn" onclick="addQItem()">+ Add Item</button><button class="btn r" onclick="previewQuote()">Preview Quotation</button><button class="btn" onclick="generateLOA()">Letter of Appointment</button><button class="btn p" onclick="sendQ()">Send / Save Revision</button>')+`
<div class="quoteMeta"><div class="metaBox"><span class="small">Company</span><b>${esc(c.name)}</b><span class="small">${esc(c.uen)} / ${esc(c.gst)}</span></div><div class="metaBox"><span class="small">Client</span><b>${esc(q.clientMeta.name)}</b><span class="small">${esc(q.clientMeta.nric||'No NRIC/UEN')}</span></div><div class="metaBox"><span class="small">Project Address</span><b>${esc(q.clientMeta.address)}</b><span class="small">${esc(q.clientMeta.postal||'')}</span></div><div class="metaBox"><span class="small">Served By / Contact</span><b>${esc(uname(q.idUser))}</b><span class="small">${esc(q.clientMeta.phone||'')} ${esc(q.clientMeta.email||'')}</span></div></div>
${miss.length?`<div class="dangerbox" style="margin-top:12px"><b>Missing before send:</b> ${miss.join(', ')}</div>`:''}
<div class="grid sidegrid" style="margin-top:14px"><div>${Object.entries(groups).map(([area,sections])=>`<div class="scopeClean"><div class="areaTitle">${esc(area)}</div>${Object.entries(sections).map(([section,arr])=>`<div class="sectionTitle2">${esc(section)}</div>${arr.map(({it,n})=>`<div class="scopeLine"><div><b>${esc(it.name)}</b><div class="desc">${esc(it.desc||'')}</div><div class="internal">Internal: Cost ${money(it.cost)} • Qty ${it.qty} ${esc(it.unit)} • ${esc(it.pricingType)}</div></div><div><span class="small">Selling / Unit</span><br>${itemCounts(it)?money(it.price):'<span class="amountWord">'+esc(it.pricingType)+'</span>'}</div><div><span class="small">Validation</span><br>${qvalid(it)?'<span class="pill green">OK</span>':'<span class="pill red">Outside Range</span>'}</div><div><span class="small">Amount</span><div class="amt">${qdisplay(it)}</div></div><div><button class="btn s" onclick="editQuoteItem(${n})">Edit</button><br><span class="danger" onclick="S.quotes.find(x=>x.id==qDetail).items.splice(${n},1);show('quotation')">Delete</span></div></div>`).join('')}`).join('')}</div>`).join('')||'<div class="card">No items yet. Add an Area / Work Section item.</div>'}<br><div class="card"><h3>Sent Revision History</h3><table><tr><th>Revision</th><th>Date Sent</th><th>Template</th><th>Total</th><th>Sent By</th></tr>${q.versions.map(v=>`<tr><td>${v.v}</td><td>${v.date}</td><td>${v.template}</td><td>${money(v.total)}</td><td>${v.by}</td></tr>`).join('')||'<tr><td colspan="5">No sent revision yet.</td></tr>'}</table></div></div>
<div class="card"><h3>Quotation Summary</h3><div class="small">Document No.</div><b>${q.id}</b><br><br><div class="small">Template</div><select onchange="q.template=this.value;save();show('quotation')">${S.settings.templates.map(t=>`<option ${t==q.template?'selected':''}>${t}</option>`).join('')}</select><br><br><div class="small">Internal Cost</div><div class="money">${money(qcost(q))}</div><br><div class="small">Subtotal</div><div class="money">${money(qtot(q))}</div><br>${field('q_discount','Discount',q.discount,'number')}<button class="btn s" onclick="q.discount=+$('q_discount').value||0;show('quotation')">Apply Discount</button><br><br><div class="small">GST ${c.gstRate||0}%</div><div class="money">${money(qgst(q))}</div><br><div class="small">Grand Total</div><div class="total">${money(qgrand(q))}</div><br>${allValid?'<span class="pill green">Price validation passed</span>':'<span class="pill red">Check price range</span>'}<br><br><h3>Auto Payment Schedule</h3><table>${paymentSchedule(q).map(x=>`<tr><td>${x.pct}%</td><td>${esc(x.label)}</td><td>${money(x.amount)}</td></tr>`).join('')}</table></div></div>`}
function newQuote(){let ps=S.projects.filter(canP).filter(p=>p.status!='Closed');modal(`<h2>New Quotation</h2><div class="warnbox">Preferred flow is to create/open the Case File first. This selector shows the actual client and site — not internal P1/P2 codes.</div><div class="field"><label>Case / Client / Site</label><select id="nq_p">${ps.map(p=>`<option value="${p.id}">${esc(p.client)} — ${esc(p.site)} — ${esc(co(p.co).name)}</option>`).join('')}</select></div><br>${field('nq_t','Quotation Template',S.settings.templates[0],'select',S.settings.templates.join('|'))}<br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveNewQuote()">Create Quotation</button>`)}
function saveNewQuote(){let p=S.projects.find(x=>x.id==$('nq_p').value),q={id:docNo('Q',p.co),p:p.id,co:p.co,client:p.client,project:p.name,idUser:p.idUser,status:'Draft',created:today(),lastSent:'',template:$('nq_t').value,versions:[],versionSnapshots:[],discount:0,clientMeta:{name:p.client,nric:p.nric||'',address:p.site||'',postal:p.postal||'',phone:p.phone||'',email:p.email||''},items:[]};S.quotes.push(q);activity(p,'Quotation created',q.id);qDetail=q.id;closeModal();show('quotation')}
function editQuoteItem(n){let q=S.quotes.find(x=>x.id==qDetail),i=q.items[n],areas=[...new Set(q.items.map(x=>x.area).filter(Boolean))];modal(`<h2>Edit Quotation Item</h2><div class="form"><div class="field"><label>Area / Location</label><input id="eq_area" list="areaList" value="${esc(i.area)}"><datalist id="areaList">${areas.map(a=>`<option value="${esc(a)}">`).join('')}<option value="Kitchen 1"><option value="Kitchen Wall 1"><option value="Living Room"><option value="Master Bedroom"><option value="Master Bathroom"></datalist></div><div class="field"><label>Work Section Library</label><select id="eq_secsel">${S.settings.scopeSections.map(s=>`<option ${s==i.section?'selected':''}>${esc(s)}</option>`).join('')}<option value="__custom">+ Custom / New Section</option></select></div>${field('eq_seccustom','Custom Work Section',S.settings.scopeSections.includes(i.section)?'':i.section)}${field('eq_name','Client-facing Item Name',i.name)}${field('eq_cat','Internal Category',i.cat)}${field('eq_pt','Pricing Type',i.pricingType,'select','Amount|Inclusive|Complimentary|F.O.C|Optional')}${field('eq_unit','Unit',i.unit)}${field('eq_qty','Qty',i.qty,'number')}${field('eq_cost','Internal Approx Cost',i.cost,'number')}${field('eq_price','Selling Price',i.price,'number')}${field('eq_desc','Detailed Description / Client Wording',i.desc,'textarea','','full')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveQuoteItemEdit(${n})">Save Item</button>`)}
function saveQuoteItemEdit(n){let q=S.quotes.find(x=>x.id==qDetail),i=q.items[n],sel=$('eq_secsel').value;i.area=$('eq_area').value;i.section=sel=='__custom'?$('eq_seccustom').value:sel;i.name=$('eq_name').value;i.cat=$('eq_cat').value;i.pricingType=$('eq_pt').value;i.unit=$('eq_unit').value;i.qty=+$('eq_qty').value||0;i.cost=+$('eq_cost').value||0;i.price=+$('eq_price').value||0;i.desc=$('eq_desc').value;closeModal();show('quotation')}
function addQItem(){let q=S.quotes.find(x=>x.id==qDetail),areas=[...new Set(q.items.map(i=>i.area).filter(Boolean))];modal(`<h2>Add Quotation Item</h2><div class="form"><div class="field"><label>Area / Location</label><input id="qi_area" list="newAreaList" placeholder="e.g. Kitchen 1 / Kitchen Wall 2"><datalist id="newAreaList">${areas.map(a=>`<option value="${esc(a)}">`).join('')}<option value="Kitchen 1"><option value="Kitchen Wall 1"><option value="Living Room"><option value="Master Bedroom"><option value="Master Bathroom"></datalist></div><div class="field"><label>Work Section Library</label><select id="qi_secsel">${S.settings.scopeSections.map(s=>`<option>${esc(s)}</option>`).join('')}<option value="__custom">+ Custom / New Work Section</option></select></div>${field('qi_seccustom','Custom Work Section','')}${field('qi_mode','Item Source','Custom Item|Select Master Item','select')}${field('qi_master','Master Item',S.items[0]?.id||'','select',S.items.map(i=>i.id).join('|'))}${field('qi_name','Client-facing Item Name','')}${field('qi_cat','Internal Category','Carpentry|Electrical|Tiles|Surface|Reinstatement|Other','select')}${field('qi_pricing','Pricing Type','Amount|Inclusive|Complimentary|F.O.C|Optional','select')}${field('qi_unit','Unit','Lot')}${field('qi_qty','Qty','1','number')}${field('qi_cost','Internal Approx Cost','0','number')}${field('qi_price','Selling Price','0','number')}${field('qi_save','Save Custom Item to Master?','No|Yes','select')}${field('qi_desc','Detailed Description / Client Wording','','textarea','','full')}</div><div class="warnbox">Work Section is connected to Master Data. Choose one from the library or type a new custom section. Area/Location remains flexible for real renovation names.</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveQItem()">Add Item</button>`)}
function saveQItem(){let q=S.quotes.find(x=>x.id==qDetail),it,area=$('qi_area').value||'Unassigned Area',sel=$('qi_secsel').value,section=sel=='__custom'?$('qi_seccustom').value:sel,ptype=$('qi_pricing').value;if($('qi_mode').value=='Select Master Item'){let m=S.items.find(i=>i.id==$('qi_master').value);it={custom:false,name:m.name,cat:m.cat,desc:$('qi_desc').value||m.desc,unit:m.unit,qty:+$('qi_qty').value||1,cost:m.cost,price:+$('qi_price').value||0,area,section,pricingType:ptype}}else{it={custom:true,name:$('qi_name').value,cat:$('qi_cat').value,desc:$('qi_desc').value,unit:$('qi_unit').value,qty:+$('qi_qty').value||1,cost:+$('qi_cost').value||0,price:+$('qi_price').value||0,area,section,pricingType:ptype};if($('qi_save').value=='Yes')S.items.push({id:uid('I'),name:it.name,cat:it.cat,unit:it.unit,cost:it.cost,desc:it.desc})}q.items.push(it);closeModal();show('quotation')}
function sendQ(){let q=S.quotes.find(x=>x.id==qDetail),p=S.projects.find(x=>x.id==q.p),miss=missingQuote(q);if(miss.length){toast('Complete required quotation data before send');return}if(!q.items.every(qvalid)){toast('Check Amount item price range before send');return}q.status='Sent';q.lastSent=today();let rev='Rev '+String(q.versions.length+1).padStart(2,'0');q.versions.push({v:rev,date:today(),template:q.template,total:qgrand(q),by:user().name});q.versionSnapshots.push({v:rev,date:new Date().toLocaleString(),clientMeta:JSON.parse(JSON.stringify(q.clientMeta)),items:JSON.parse(JSON.stringify(q.items)),discount:q.discount,total:qgrand(q),template:q.template,by:user().name});p.status='Quotation Sent';activity(p,'Quotation revision sent',q.id+' '+rev);toast('Revision snapshot saved. Follow-up date reset.');show('quotation')}
function scopeRows(q){let g={};q.items.forEach(i=>{let a=i.area||'Unassigned Area',s=i.section||'General Works';g[a]=g[a]||{};g[a][s]=g[a][s]||[];g[a][s].push(i)});return Object.entries(g).map(([a,ss])=>`<div class="previewPink">${esc(a)}</div>${Object.entries(ss).map(([s,its])=>`<b>${esc(s)}</b><table><tr><th>Scope of Works</th><th>Amount</th></tr>${its.map(i=>`<tr><td><b>${esc(i.name)}</b><br><span class="small">${esc(i.desc||'')}</span></td><td>${itemCounts(i)?money(i.qty*i.price):esc(i.pricingType)}</td></tr>`).join('')}</table>`).join('')}`).join('')}
function quotePreviewHtml(q){let c=co(q.co),m=q.clientMeta;return `<div class="previewHead"><div><img src="${logoUrl(c.logo)}"><br><b>${esc(c.name)}</b></div><div class="small"><b>UEN:</b> ${esc(c.uen)}<br><b>GST:</b> ${esc(c.gst)}<br>${esc(c.addr)}<br>${esc(c.phone)}</div></div><table><tr><td>Name</td><td>${esc(m.name)}</td><td>Quotation No.</td><td>${esc(q.id)}</td></tr><tr><td>NRIC / UEN</td><td>${esc(m.nric||'-')}</td><td>Date</td><td>${today()}</td></tr><tr><td>Address</td><td>${esc(m.address)} ${esc(m.postal||'')}</td><td>Served By</td><td>${esc(uname(q.idUser))}</td></tr><tr><td>H/P</td><td>${esc(m.phone||'-')}</td><td>Email</td><td>${esc(m.email||'-')}</td></tr></table><p>${esc(c.docs.quoteIntro)}</p><h3>Scope of Works</h3>${scopeRows(q)}<table class="totals"><tr><td>Subtotal</td><td>${money(qtot(q))}</td></tr><tr><td>Discount</td><td>(${money(q.discount||0)})</td></tr><tr><td>GST ${c.gstRate||0}%</td><td>${money(qgst(q))}</td></tr><tr><td>Grand Total</td><td><b>${money(qgrand(q))}</b></td></tr></table><h3>Payment Schedule</h3><table>${paymentSchedule(q).map(x=>`<tr><td>${x.pct}%</td><td>${esc(x.label)}</td><td>${money(x.amount)}</td></tr>`).join('')}</table><p class="small">${esc(c.docs.terms)}</p>`}
function previewQuote(){let q=S.quotes.find(x=>x.id==qDetail);modal(`<div class="previewPaper">${quotePreviewHtml(q)}</div><br><button class="btn" onclick="closeModal()">Close</button> <button class="btn p" onclick="printDoc('Quotation ${q.id}',document.querySelector('.previewPaper').innerHTML)">Print / Save PDF</button>`)}
function generateLOA(){let q=S.quotes.find(x=>x.id==qDetail),p=S.projects.find(x=>x.id==q.p)||{};modal(`<h2>Letter of Appointment</h2><div class="warnbox">Flexible: generate when needed. Company wording comes from Superadmin template.</div><div class="form">${field('loa_fee','Design Fee / Appointment Fee','0','number')}${field('loa_budget','Estimated Project Budget',p.budget||qgrand(q),'number')}${field('loa_valid','Appointment Validity (months)','6','number')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="printLOA()">Preview / Print</button>`)}
function printLOA(){let q=S.quotes.find(x=>x.id==qDetail),c=co(q.co),m=q.clientMeta;let body=`<div class="previewHead"><div><img src="${logoUrl(c.logo)}"><br><b>${esc(c.name)}</b></div><div class="small">${esc(c.addr)}<br>UEN ${esc(c.uen)}</div></div><h2>Letter of Appointment</h2><p><b>I/We:</b> ${esc(m.name)}<br><b>NRIC/UEN:</b> ${esc(m.nric||'-')}<br><b>Premise:</b> ${esc(m.address)} ${esc(m.postal||'')}</p><p>${esc(c.docs.loa)}</p><p>Design / Appointment Fee: <b>${money(+$('loa_fee').value||0)}</b><br>Estimated Project Budget: <b>${money(+$('loa_budget').value||0)}</b><br>Validity: ${esc($('loa_valid').value)} months</p><br><br>Interior Designer Signature: ____________________ &nbsp;&nbsp; Client Signature: ____________________`;modal(`<div class="previewPaper">${body}</div><br><button class="btn" onclick="closeModal()">Close</button> <button class="btn p" onclick="printDoc('Letter of Appointment',document.querySelector('.previewPaper').innerHTML)">Print / Save PDF</button>`)}

P.projects=()=>pDetail?projDetail():head('Project Costing Overview','Filter first, then open detail. VO and DO are inside Project Costing.','Project Costing','<button class="btn p" onclick="newCase()">+ Create Case</button>')+fb('projects')+`<div class="card"><h3>Project List</h3>${projectTable(base(S.projects.filter(canP),p=>({...p,date:p.start,worker:p.idUser,status:p.status})))}</div>`;function projDetail(){let p=S.projects.find(x=>x.id==pDetail),cs=S.costs.filter(c=>c.p==p.id);if(!canP(p)){pDetail='';return '<div class="card">No access.</div>'}return head(p.name,'Real Cost / VO / DO / Manpower under one project.','Project Detail','<button class="btn" onclick="pDetail=\'\';show(\'projects\')">← Overview</button><button class="btn p" onclick="addCost()">+ Add Cost</button>')+`<div class="card"><b>${co(p.co).name}</b> | ${p.client} | ${pill(p.status)}<div class="tabs">${['cost','vo','do','manpower'].map(x=>`<button class="${sub==x?'active':''}" onclick="sub='${x}';show('projects')">${x.toUpperCase()}</button>`).join('')}</div>${sub=='cost'?costHtml(cs):sub=='vo'?voHtml(p):sub=='do'?doHtml(p):manHtml()}</div>`}function costHtml(cs){return `<div class="grid four"><div class="card"><span class="small">Budget</span><div class="money">${money(cs.reduce((a,c)=>a+c.budget,0))}</div></div><div class="card"><span class="small">Actual</span><div class="money">${money(cs.reduce((a,c)=>a+c.actual,0))}</div></div><div class="card"><span class="small">Committed</span><div class="money">${money(cs.reduce((a,c)=>a+c.committed,0))}</div></div><div class="card"><span class="small">Projected</span><div class="money">${money(cs.reduce((a,c)=>a+c.actual+c.committed,0))}</div></div></div><br><table><tr><th>Origin</th><th>Category</th><th>Description</th><th>Supplier / Ref</th><th>Actual</th><th>Status</th><th>Action</th></tr>${cs.map(c=>`<tr><td>${c.source=='AUTO'?'<span class="pill green">AUTO</span>':'<span class="pill blue">MANUAL</span>'}</td><td>${esc(c.cat)}</td><td>${esc(c.desc)}</td><td>${esc(c.supplier||'')}<br><span class="small">${esc(c.invoice||c.sourceInvoice||'')}</span></td><td>${money(c.actual)}</td><td>${pill(c.status)}</td><td>${c.source=='AUTO'?'<span class="small">From approved supplier invoice</span>':`<span class="danger" onclick="S.costs=S.costs.filter(x=>x.id!='${c.id}');show(active)">Delete</span>`}</td></tr>`).join('')||'<tr><td colspan="7">No project cost yet.</td></tr>'}</table>`}
function addCost(){modal(`<h2>Add Cost</h2><div class="form">${field('ac_cat','Category','Materials|Supplier|Manpower|Transport|Misc','select')}${field('ac_desc','Description','New cost')}${field('ac_sup','Supplier','Internal Team')}${field('ac_budget','Budget','0','number')}${field('ac_actual','Actual','0','number')}${field('ac_comm','Committed','0','number')}${field('ac_inv','Invoice No.','INV-TEST')}</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="S.costs.push({id:uid('C'),p:pDetail,cat:$('ac_cat').value,desc:$('ac_desc').value,supplier:$('ac_sup').value,invoice:$('ac_inv').value,budget:+$('ac_budget').value||0,actual:+$('ac_actual').value||0,committed:+$('ac_comm').value||0,status:'Pending ID Approval'});closeModal();show('projects')">Save</button>`)}function addVO(){modal(`<h2>Add VO</h2><div class="form">${field('vo_r','Reason','Client requested additional work')}${field('vo_i','Item','Additional cabinet')}${field('vo_q','Qty','1','number')}${field('vo_p','Unit Price','500','number')}</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="let p=S.projects.find(x=>x.id==pDetail);S.vos.push({id:'VO-2026-'+String(S.vos.length+1).padStart(4,'0'),p:p.id,co:p.co,reason:$('vo_r').value,date:today(),status:'Pending',items:[{name:$('vo_i').value,qty:+$('vo_q').value||1,price:+$('vo_p').value||0}]});closeModal();sub='vo';show('projects')">Save</button>`)}
P.invoices=()=>{let pids=S.projects.filter(canP).map(p=>p.id),rows=S.invoices.filter(i=>pids.includes(i.p));rows=base(rows,i=>({...i,date:i.created,worker:i.idUser,status:invStatus(i)}));if(invSub!='All')rows=rows.filter(i=>invStatus(i)==invSub);return head('Invoice Overview','Filter by company, project, worker, date and payment status. Create staged invoices directly from accepted quotation/payment schedule.','Invoices','<button class="btn p" onclick="newStageInvoice()">+ Create Staged Invoice</button><button class="btn" onclick="recordPay()">Record Payment</button>')+`<div class="mini">${['All','Unpaid','Partially Paid','Overdue','Paid'].map(x=>`<button class="${invSub==x?'active':''}" onclick="invSub='${x}';show('invoices')">${x}</button>`).join('')}</div>`+fb('invoices')+`<div class="card"><h3>Invoices / Official Receipts</h3>${invTable(rows)}</div>`};
function invTable(rows){if(!rows.length)return '<p class="small">No invoice.</p>';return `<div class="wrap"><table><tr><th>Invoice</th><th>Company</th><th>Project / Stage</th><th>Amount</th><th>Received</th><th>Outstanding</th><th>Due</th><th>Payment %</th><th>Status</th><th>Document</th></tr>${rows.map(i=>{let p=paid(i),pct=i.amount?p/i.amount*100:0;return `<tr><td>${i.id}</td><td>${co(i.co).short}</td><td>${esc(i.project)}<br><span class="small">${esc(i.stage||'Manual Invoice')} / ${esc(i.client)}</span></td><td>${money(i.amount)}</td><td>${money(p)}</td><td>${money(i.amount-p)}</td><td>${i.due}<br><span class="${invStatus(i)=='Overdue'?'danger':'small'}">${invStatus(i)=='Overdue'?days(i.due)+' days overdue':'-'}</span></td><td><b class="${pct<S.settings.payPct?'danger':'link'}">${pct.toFixed(1)}%</b></td><td>${pill(invStatus(i))}</td><td><button class="btn s" onclick="printInv('${i.id}')">Invoice / Receipt</button></td></tr>`}).join('')}</table></div>`}
function newStageInvoice(){let qs=S.quotes.filter(q=>canP(S.projects.find(p=>p.id==q.p))&&q.status!='Draft');if(!qs.length){toast('Send/accept a quotation first');return}let q=qs[0],sch=paymentSchedule(q);modal(`<h2>Create Staged Invoice</h2><div class="form">${field('ni_q','Quotation',q.id,'select',qs.map(x=>x.id).join('|'))}${field('ni_stage','Payment Stage','0','select','0|1|2|3')}${field('ni_due','Due Date',today(),'date')}</div><div class="warnbox">Stage 0 = down payment; 1 = commencement; 2 = carpentry measurement; 3 = completion/handover. Amount is calculated automatically from the company payment template.</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveStageInvoice()">Create Invoice</button>`)}
function saveStageInvoice(){let q=S.quotes.find(x=>x.id==$('ni_q').value),p=S.projects.find(x=>x.id==q.p),idx=+$('ni_stage').value||0,st=paymentSchedule(q)[idx];let i={id:docNo('I',q.co),p:q.p,co:q.co,client:q.client,project:q.project,idUser:q.idUser,amount:st.amount,due:$('ni_due').value,created:today(),status:'Unpaid',stage:st.label,stagePct:st.pct,quoteId:q.id,payments:[]};S.invoices.push(i);closeModal();toast('Staged invoice created from quotation');show('invoices')}
function recordPay(){let inv=S.invoices.filter(i=>canP(S.projects.find(p=>p.id==i.p)));modal(`<h2>Record Payment</h2><div class="form">${field('rp_inv','Invoice',inv[0]?.id||'','select',inv.map(i=>i.id).join('|'))}${field('rp_amt','Amount','1000','number')}${field('rp_method','Method','Bank Transfer|PayNow|Credit Card|Cash|Cheque','select')}${field('rp_ref','Reference','RCPT-'+Math.floor(Math.random()*9999))}</div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="let i=S.invoices.find(x=>x.id==$('rp_inv').value);i.payments.push({date:today(),method:$('rp_method').value,amount:+$('rp_amt').value||0,ref:$('rp_ref').value});i.status=invStatus(i);closeModal();show('invoices')">Save</button>`)}
function printInv(id){let i=S.invoices.find(x=>x.id==id)||S.invoices[0],p=S.projects.find(x=>x.id==i.p)||{},c=co(i.co),rec=paid(i),due=Math.max(i.amount-rec,0),base=i.amount/(1+(c.gstRate||0)/100),tax=i.amount-base;let body=`<div class="previewHead"><div><img src="${logoUrl(c.logo)}"><br><b>${esc(c.name)}</b></div><div class="small">${esc(c.addr)}<br>UEN ${esc(c.uen)}<br>${esc(c.gst)}</div></div><h2>INV / OFFICIAL RECEIPT</h2><p>${esc(c.docs.invoice)}</p><table><tr><td>Customer</td><td>${esc(i.client)}</td><td>Invoice Date</td><td>${esc(i.created)}</td></tr><tr><td>Project Address</td><td>${esc(p.site||'')}</td><td>Invoice Number</td><td>${esc(i.id)}</td></tr><tr><td>Reference</td><td>${esc(uname(i.idUser))}</td><td>Due Date</td><td>${esc(i.due)}</td></tr></table><table><tr><th>Description</th><th>Quantity</th><th>Unit Price</th><th>Tax</th><th>Amount SGD</th></tr><tr><td>${esc((i.stagePct||'')+'% '+(i.stage||'Payment'))} for ${esc(p.site||i.project)}</td><td>1.00</td><td>${money(base)}</td><td>${c.gstRate||0}%</td><td>${money(base)}</td></tr></table><table class="totals"><tr><td>Subtotal</td><td>${money(base)}</td></tr><tr><td>GST ${c.gstRate||0}%</td><td>${money(tax)}</td></tr><tr><td>Total SGD</td><td><b>${money(i.amount)}</b></td></tr><tr><td>Less Amount Paid</td><td>${money(rec)}</td></tr><tr><td>Amount Due SGD</td><td><b>${money(due)}</b></td></tr></table><p class="small">${esc(c.bank)}<br>PayNow UEN: ${esc(c.paynow)}</p>`;modal(`<div class="previewPaper">${body}</div><br><button class="btn" onclick="closeModal()">Close</button> <button class="btn p" onclick="printDoc('${i.id}',document.querySelector('.previewPaper').innerHTML)">Print / Save PDF</button>`)}

function newStageInvoiceForCase(pid){let qs=caseQuotes(pid).filter(q=>q.status=='Accepted'||q.status=='Sent');if(!qs.length){toast('No sent/accepted quotation available for staged invoice');return}let q=qs[qs.length-1];modal(`<h2>Create Staged Invoice</h2><div class="form"><div class="field"><label>Quotation</label><select id="ci_q">${qs.map(x=>`<option value="${x.id}">${x.id} — ${money(qgrand(x))}</option>`).join('')}</select></div><div class="field"><label>Payment Stage</label><select id="ci_stage"><option value="0">1 — Down Payment</option><option value="1">2 — Commencement</option><option value="2">3 — Carpentry Measurement</option><option value="3">4 — Completion / Handover</option></select></div>${field('ci_due','Due Date',today(),'date')}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveCaseStageInvoice('${pid}')">Create Invoice</button>`)}
function saveCaseStageInvoice(pid){let q=S.quotes.find(x=>x.id==$('ci_q').value),st=paymentSchedule(q)[+$('ci_stage').value||0],i={id:docNo('I',q.co),p:pid,co:q.co,client:q.client,project:q.project,idUser:q.idUser,amount:st.amount,due:$('ci_due').value,created:today(),status:'Unpaid',stage:st.label,stagePct:st.pct,quoteId:q.id,payments:[]};S.invoices.push(i);let p=S.projects.find(x=>x.id==pid);activity(p,'Customer invoice created',`${i.id} • ${st.label} • ${money(i.amount)}`);closeModal();caseSub='invoice';show('cases')}
function recordPayForCase(pid){let inv=caseInvoices(pid);if(!inv.length){toast('No invoice to receive payment against');return}modal(`<h2>Record Customer Payment</h2><div class="form"><div class="field"><label>Invoice</label><select id="cp_inv">${inv.map(i=>`<option value="${i.id}">${i.id} — ${esc(i.stage||'Invoice')} — Outstanding ${money(Math.max(i.amount-paid(i),0))}</option>`).join('')}</select></div>${field('cp_amt','Amount','1000','number')}${field('cp_method','Method','Bank Transfer|PayNow|Credit Card|Cash|Cheque','select')}${field('cp_ref','Reference','RCPT-'+Math.floor(Math.random()*9999))}</div><br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveCasePayment('${pid}')">Save Payment</button>`)}
function saveCasePayment(pid){let i=S.invoices.find(x=>x.id==$('cp_inv').value),amt=+$('cp_amt').value||0;i.payments.push({date:today(),method:$('cp_method').value,amount:amt,ref:$('cp_ref').value});i.status=invStatus(i);let p=S.projects.find(x=>x.id==pid);activity(p,'Customer payment received',`${i.id} • ${money(amt)} • ${$('cp_method').value}`);closeModal();caseSub='payment';show('cases')}

P.po=()=>{let pids=S.projects.filter(canP).map(p=>p.id),rows=S.sup.filter(s=>pids.includes(s.p));rows=base(rows,s=>({...s,date:s.date,status:supStatus(s)}));if(poSub!='All')rows=rows.filter(s=>supStatus(s)==poSub);return head('PO / Supplier Invoice Aging','Supplier invoice is linked to a real Case. Assigned ID verifies it; approval posts Actual Project Cost once, then Superadmin/Accounts can pay.','PO / Supplier','<button class="btn p" onclick="addSup()">+ Add Supplier Invoice</button><button class="btn r" onclick="printPO()">Generate PO</button>')+`<div class="mini">${['All','Pending Verification','Approved','Rejected / Disputed','Partial','Paid','Duplicate Warning','Overdue'].map(x=>`<button class="${poSub==x?'active':''}" onclick="poSub='${x}';show('po')">${x}</button>`).join('')}</div>`+fb('po')+`<div class="grid two"><div class="card"><h3>Purchase Orders</h3>${poTable()}</div><div class="card"><h3>Supplier Invoice Aging</h3>${supTable(rows,false)}</div></div>`};
function supStatus(s){if(isDup(s))return 'Duplicate Warning';if(s.approve=='Rejected / Disputed')return 'Rejected / Disputed';if(s.pay=='Paid')return 'Paid';if(days(s.due)>0&&s.pay!='Paid')return 'Overdue';if(s.approve=='Pending Verification')return 'Pending Verification';if(s.pay=='Partial')return 'Partial';return s.approve}
function poTable(){return `<table><tr><th>PO</th><th>Supplier</th><th>Case / Project</th><th>Amount</th><th>Status</th></tr>${S.pos.filter(po=>canP(S.projects.find(p=>p.id==po.p))).map(po=>`<tr><td>${po.id}</td><td>${po.supplier}</td><td>${esc((S.projects.find(p=>p.id==po.p)||{}).name||'')}</td><td>${money(po.items.reduce((a,i)=>a+i.qty*i.price,0))}</td><td>${pill(po.status)}</td></tr>`).join('')}</table>`}
function supTable(rows,compact){if(!rows.length)return '<p class="small">No supplier invoice.</p>';return `<div class="${compact?'':'wrap'}"><table><tr><th>Supplier</th><th>Invoice</th><th>Case / Project</th><th>Amount</th><th>Unpaid</th><th>Approval</th>${compact?'':'<th>Payment</th><th>Attachment</th><th>Duplicate</th><th>Action</th>'}</tr>${rows.map(s=>{let p=S.projects.find(p=>p.id==s.p)||{},canV=canVerifySupplier(s),canPay=user().role=='Superadmin'||has('Make Supplier Payment');return `<tr><td>${esc(s.supplier)}</td><td>${esc(s.invoice)}</td><td>${esc(p.client)}<br><span class="small">${esc(p.site||p.name)}</span></td><td>${money(s.amount)}</td><td>${money(s.amount-s.paid)}</td><td>${pill(s.approve)}<br><span class="small">${s.verifyBy?'Checked by '+uname(s.verifyBy):'Assigned ID: '+uname(p.idUser)}</span>${s.rejectReason?'<br><span class="danger">'+esc(s.rejectReason)+'</span>':''}</td>${compact?'':`<td>${pill(s.pay)}</td><td>${s.file?`<span class="link" onclick="modal('<h2>Attachment</h2><p>${esc(s.file)}</p><div class=warnbox>Frontend test stores file name only. Real backend will store the document privately.</div><button class=btn onclick=closeModal()>Close</button>')">${esc(s.file)}</span>`:'-'}</td><td>${isDup(s)?'<span class="danger">Duplicate</span>':'-'}</td><td>${canV&&s.approve=='Pending Verification'?`<button class="btn s g" onclick="approveSupplier('${s.id}')">Approve</button> <button class="btn s r" onclick="rejectSupplier('${s.id}')">Reject</button>`:''}${canPay&&s.approve=='Approved'&&s.pay!='Paid'?` <button class="btn s" onclick="paySupplier('${s.id}')">Pay</button>`:''}</td>`}</tr>`}).join('')}</table></div>`}
function addSup(){let ps=S.projects.filter(canP).filter(p=>p.status!='Closed');modal(`<h2>Add Supplier Invoice</h2><div class="warnbox">Select the actual Case/Project by client and site. Assigned ID will be notified to verify the invoice.</div><div class="form">${field('as_sup','Supplier / Vendor','Niro Granite Pte Ltd')}${field('as_inv','Supplier Invoice No.','INV-2026-0187')}<div class="field"><label>Case / Project</label><select id="as_p">${ps.map(p=>`<option value="${p.id}">${esc(p.client)} — ${esc(p.site)} — ${esc(co(p.co).name)}</option>`).join('')}</select></div>${field('as_amt','Invoice Amount','1000','number')}${field('as_due','Due Date',today(),'date')}<div class="field full"><label>Supplier Invoice Attachment</label><input id="as_file" type="file" accept=".pdf,image/*"></div></div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveSup()">Save & Send to ID</button>`)}
function saveSup(){let p=S.projects.find(x=>x.id==$('as_p').value),f=$('as_file').files[0],s={id:'SIN-'+today().slice(2,7).replace('-','')+'-'+String(S.sup.length+1).padStart(3,'0'),co:p.co,supplier:$('as_sup').value,invoice:$('as_inv').value,p:p.id,po:'',amount:+$('as_amt').value||0,paid:0,date:today(),due:$('as_due').value,approve:'Pending Verification',pay:'Unpaid',verifyBy:'',file:f?f.name:'',rejectReason:'',costPosted:false};S.sup.push(s);activity(p,'Supplier invoice uploaded',`${s.supplier} ${s.invoice} • ${money(s.amount)}`);noticeTo([p.idUser],'Supplier Invoice Needs Verification',`${s.supplier} • ${s.invoice} • ${money(s.amount)} • ${p.client}`,'cases');closeModal();toast(isDup(s)?'Saved with duplicate warning and sent to ID':'Supplier invoice sent to assigned ID');show('po')}
function approveSupplier(id){let s=S.sup.find(x=>x.id==id),p=S.projects.find(x=>x.id==s.p);if(!canVerifySupplier(s)){toast('Only assigned ID or authorised override can verify');return}s.approve='Approved';s.verifyBy=user().id;s.rejectReason='';if(!s.costPosted&&!S.costs.some(c=>c.sourceInvoice==s.id)){S.costs.push({id:uid('C'),p:p.id,cat:'Supplier Invoice',desc:s.supplier+' • '+s.invoice,supplier:s.supplier,invoice:s.invoice,budget:0,actual:s.amount,committed:0,status:'Approved by ID',source:'AUTO',sourceInvoice:s.id});s.costPosted=true}activity(p,'Supplier invoice approved',`${s.invoice} posted automatically to Actual Project Cost.`);noticeTo(accountIds(),'Supplier Invoice Approved',`${s.supplier} ${s.invoice} ${money(s.amount)} is ready for payment.`,'po');toast('Approved and posted to Actual Project Cost');show(active)}
function rejectSupplier(id){let s=S.sup.find(x=>x.id==id);if(!canVerifySupplier(s)){toast('Only assigned ID or authorised override can reject');return}modal(`<h2>Reject / Dispute Supplier Invoice</h2><div class="field"><label>Reason</label><select id="rej_type"><option>Wrong amount</option><option>Wrong project</option><option>Work not completed</option><option>Duplicate invoice</option><option>Incorrect item</option><option>Other</option></select></div>${field('rej_note','Remark','','textarea','','full')}<br><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn r" onclick="saveRejectSupplier('${id}')">Reject / Dispute</button>`)}
function saveRejectSupplier(id){let s=S.sup.find(x=>x.id==id),p=S.projects.find(x=>x.id==s.p);s.approve='Rejected / Disputed';s.verifyBy=user().id;s.rejectReason=$('rej_type').value+($('rej_note').value?' — '+$('rej_note').value:'');activity(p,'Supplier invoice disputed',s.invoice+' • '+s.rejectReason);noticeTo(accountIds(),'Supplier Invoice Disputed',`${s.invoice}: ${s.rejectReason}`,'po');closeModal();show(active)}
function paySupplier(id){let s=S.sup.find(x=>x.id==id),p=S.projects.find(x=>x.id==s.p);if(s.approve!='Approved'){toast('Invoice must be approved first');return}s.paid=s.amount;s.pay='Paid';activity(p,'Supplier invoice paid',`${s.invoice} • ${money(s.amount)}`);noticeTo([p.idUser],'Supplier Invoice Paid',`${s.supplier} ${s.invoice} has been marked paid.`,'cases');toast('Supplier payment recorded');show(active)}
function printPO(){let p=S.pos[0];printDoc('PO '+p.id,`<p>${co(p.co).name}<br>Supplier: ${p.supplier}</p>`)}

P.profit=()=>{let pids=S.projects.filter(canP).map(p=>p.id),rows=S.comm.filter(c=>pids.includes(c.p));if(user().role!='Superadmin'&&!has('View All Commission'))rows=rows.filter(c=>c.worker==user().id&&c.status=='Approved');rows=base(rows,c=>({...c,date:c.date,status:c.paid?'Paid':c.status,worker:c.worker}));let sales=S.quotes.filter(q=>pids.includes(q.p)).reduce((a,q)=>a+qtot(q),0),cost=S.costs.filter(c=>pids.includes(c.p)).reduce((a,c)=>a+c.actual,0);return head('Profit & Commission','Filter by worker. Staff see own commission only after Superadmin approval.','Reports','<button class="btn p" onclick="approveAllComm()">Approve Pending</button>')+fb('profit')+`<div class="grid four"><div class="card"><div class="small">Sales</div><div class="money">${money0(sales)}</div></div><div class="card"><div class="small">Cost</div><div class="money">${money0(cost)}</div></div><div class="card"><div class="small">Profit</div><div class="money">${money0(sales-cost)}</div></div><div class="card"><div class="small">Visible Commission</div><div class="money">${money0(rows.reduce((a,c)=>a+c.amount,0))}</div></div></div><br><div class="card"><h3>Commission by Worker</h3><table><tr><th>Worker</th><th>Project</th><th>Company</th><th>Amount</th><th>Status</th><th>Paid</th><th>Action</th></tr>${rows.map(c=>`<tr><td>${uname(c.worker)}</td><td>${c.project}</td><td>${co(c.co).short}</td><td>${money(c.amount)}</td><td>${pill(c.status)}</td><td>${c.paid?pill('Paid'):pill('Unpaid')}</td><td>${user().role=='Superadmin'?`<button class="btn s" onclick="c.status='Approved';show('profit')">Approve</button> <button class="btn s g" onclick="if(c.status!='Approved'){toast('Approve first')}else{c.paid=true;show('profit')}">Mark Paid</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="7">No visible commission. Staff only see approved commission.</td></tr>'}</table></div>`};function approveAllComm(){if(user().role!='Superadmin')return toast('Only Superadmin');S.comm.filter(c=>c.status=='Pending Superadmin Approval').forEach(c=>c.status='Approved');show('profit')}
P.master=()=>head('Master Data','Pricing rules, quotation templates, payment trigger, follow-up day, manpower rates and reusable scope wording.','Master Data','<button class="btn p" onclick="saveSet()">Save Settings</button>')+`<div class="grid three"><div class="card"><h3>Rules</h3>${field('st_n','Normal Markup %',S.settings.normal,'number')}${field('st_m','Max Markup %',S.settings.max,'number')}${field('st_p','Payment Trigger %',S.settings.payPct,'number')}${field('st_f','Quotation Follow-up Days',S.settings.followDays,'number')}${field('st_approval','After Client Approves Quotation',S.settings.clientApprovalFlow,'select','Auto Project Confirmed|Require Superadmin Confirmation')}</div><div class="card"><h3>3 Quotation Templates</h3>${S.settings.templates.map((t,i)=>field('tpl'+i,'Template '+(i+1),t)).join('')}</div><div class="card"><h3>Manpower Rates</h3>${field('rt_c','Carpenter / Hour',S.settings.rates.carpenter,'number')}${field('rt_i','Installer / Hour',S.settings.rates.installer,'number')}${field('rt_t','Technician / Hour',S.settings.rates.technician,'number')}</div></div><br><div class="grid two"><div class="card"><h3>Scope / Work Section Library</h3>${field('scope_lib','Common Work Sections',S.settings.scopeSections.join('\n'),'textarea','','full')}<p class="small">One section per line. ID can still type a completely new Area / Work Section in the quotation.</p></div><div class="card"><h3>Company Document Templates</h3><p>Quotation/T&C, LOA, Invoice, VO, Handover and payment schedule are edited per company in Company Master.</p><button class="btn" onclick="show('companies')">Open Company Master</button></div></div><br><div class="card"><h3>Item Master</h3><table><tr><th>Item</th><th>Category</th><th>Description</th><th>Cost</th><th>Min</th><th>Max</th></tr>${S.items.map(i=>`<tr><td>${i.name}</td><td>${i.cat}</td><td>${i.desc}</td><td>${money(i.cost)}</td><td>${money(i.cost*(1+S.settings.normal/100))}</td><td>${money(i.cost*(1+S.settings.max/100))}</td></tr>`).join('')}</table></div>`;
function saveSet(){S.settings.normal=+$('st_n').value||30;S.settings.max=+$('st_m').value||40;S.settings.payPct=+$('st_p').value||30;S.settings.followDays=+$('st_f').value||10;S.settings.clientApprovalFlow=$('st_approval').value;S.settings.templates=S.settings.templates.map((_,i)=>$('tpl'+i).value);S.settings.rates={carpenter:+$('rt_c').value||0,installer:+$('rt_i').value||0,technician:+$('rt_t').value||0};S.settings.scopeSections=$('scope_lib').value.split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean);toast('Master settings saved');show('master')}

P.users=()=>head('Users & Flexible Access','Superadmin can edit staff company access, project visibility and permission matrix.','Users','<button class="btn p" onclick="editUser()">+ Add User</button>')+`<div class="warnbox"><b>Confirmed:</b> normal worker can only see quotations/cases/projects created by or assigned to them. Closed case/project hidden unless Superadmin allows. Commission visible only after Superadmin approval.</div><div class="card"><h3>Staff Access Matrix</h3><div class="wrap"><table><tr><th>Name</th><th>Role</th><th>Company</th><th>Project Visibility</th><th>Closed</th><th>Commission</th><th>Action</th></tr>${S.users.map(u=>`<tr><td><b>${u.name}</b><br><span class="small">${u.email}</span></td><td>${u.role}</td><td>${u.co.includes('ALL')?'All Companies':u.co.map(x=>co(x).name).join(', ')}</td><td>${u.vis}</td><td>${u.closed?pill('Allowed'):pill('Blocked')}</td><td>${u.commAll?'All':'Approved own only'}</td><td><button class="btn s" onclick="editUser('${u.id}')">Edit</button></td></tr>`).join('')}</table></div></div><br><div class="card"><h3>Audit Log</h3><table>${S.audit.map(a=>`<tr><td>${a.date}</td><td>${a.by}</td><td>${a.action}</td><td>${a.detail}</td></tr>`).join('')}</table></div>`;function editUser(id=''){let u=S.users.find(x=>x.id==id)||{id:'',name:'',email:'',role:'ID / Salesperson',co:['CO1'],vis:'Own Assigned Open Only',closed:false,commAll:false,perms:['Create Case','View Own Open Cases','Create Quotation','Edit Quotation','View Own Approved Commission']};modal(`<h2>${id?'Edit':'Add'} User</h2><div class="form">${field('eu_name','Name',u.name)}${field('eu_email','Email',u.email)}${field('eu_role','Role',u.role,'select','Superadmin|Admin|ID / Salesperson|Project Manager|Accounts|Viewer')}${field('eu_vis','Project Visibility',u.vis,'select','Own Assigned Open Only|Assigned Open Projects|All Open Projects|All Projects')}${field('eu_closed','Can View Closed?',u.closed?'Yes':'No','select','No|Yes')}${field('eu_comm','Commission View',u.commAll?'All':'Approved own only','select','Approved own only|All')}<div class="field full"><label>Company Access</label><div class="checkgrid"><label class="check"><input id="eu_all" type="checkbox" ${u.co.includes('ALL')?'checked':''}> All Companies</label>${S.companies.map(c=>`<label class="check"><input class="eu_co" type="checkbox" value="${c.id}" ${u.co.includes(c.id)?'checked':''}> ${c.name}</label>`).join('')}</div></div><div class="field full"><label>Permissions</label><div class="checkgrid">${PERMS.map(p=>`<label class="check"><input class="eu_perm" type="checkbox" value="${p}" ${u.perms.includes(p)?'checked':''}> ${p}</label>`).join('')}</div></div></div><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn p" onclick="saveUser('${id}')">Save</button>`)}function saveUser(id){let data={id:id||uid('U'),name:$('eu_name').value,email:$('eu_email').value,role:$('eu_role').value,co:$('eu_all').checked?['ALL']:[...document.querySelectorAll('.eu_co:checked')].map(x=>x.value),vis:$('eu_vis').value,closed:$('eu_closed').value=='Yes',commAll:$('eu_comm').value=='All',perms:[...document.querySelectorAll('.eu_perm:checked')].map(x=>x.value)};if(id)Object.assign(S.users.find(x=>x.id==id),data);else S.users.push(data);S.audit.push({date:new Date().toLocaleString(),by:user().name,action:id?'Updated user access':'Created user',detail:data.name+' / '+data.vis});closeModal();show('users')}
$('modal').onclick=e=>{if(e.target.id=='modal')closeModal()};show('dashboard');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
